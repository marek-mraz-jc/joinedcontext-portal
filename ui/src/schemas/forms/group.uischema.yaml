# Default form arrangement for Group (UI-02, T-2400).
# A group is a name for several people; the examples are neutral (T-2752).
apiVersion: joinedcontext.com/v1alpha1
kind: UiSchema
metadata:
  name: group
spec:
  for: Group
  guide: User-Guide/07-users-roles-approvals
  about:
    en: >-
      A group is one name for several people, so a role is given once instead of person by person.
      Members are the addresses the identity provider carries them under; somebody who has never
      signed in can be listed and joins when they do.
    sk: >-
      Skupina je jeden názov pre viac ľudí, takže rola sa udelí raz namiesto osoby po osobe.
      Členovia sú adresy, pod ktorými ich vedie poskytovateľ identity; kto sa ešte neprihlásil,
      môže byť uvedený a pripojí sa pri prvom prihlásení.
    cs: >-
      Skupina je jeden název pro více lidí, takže role se udělí jednou místo osoby po osobě.
      Členové jsou adresy, pod nimiž je vede poskytovatel identity; kdo se ještě nepřihlásil,
      může být uveden a připojí se při prvním přihlášení.
    de: >-
      Eine Gruppe ist ein Name für mehrere Personen, damit eine Rolle einmal statt pro Person
      gegeben wird. Mitglieder sind die Adressen des Identitätsanbieters; wer sich noch nie
      angemeldet hat, steht schon in der Liste und kommt beim ersten Login dazu.
  order: [name, description, members]
  groups:
    - title:
        en: The group
        sk: Skupina
        cs: Skupina
        de: Die Gruppe
      description:
        en: The name a binding gives a role to, and what the group is for whoever reviews it.
        sk: Názov, ktorému väzba udeľuje rolu, a čo je skupina pre toho, kto ju posudzuje.
        cs: Název, kterému vazba uděluje roli, a co je skupina pro toho, kdo ji posuzuje.
        de: Der Name, dem eine Bindung eine Rolle gibt, und was die Gruppe für Prüfende ist.
      fields: [name, description]
    - title:
        en: Who is in it
        sk: Kto je v nej
        cs: Kdo je v ní
        de: Wer dazugehört
      description:
        en: One address per person; the reconciler writes exactly this list into Keycloak.
        sk: Jedna adresa na osobu; rekonciliátor zapíše presne tento zoznam do Keycloaku.
        cs: Jedna adresa na osobu; rekonciliátor zapíše přesně tento seznam do Keycloaku.
        de: Eine Adresse je Person; der Reconciler schreibt genau diese Liste nach Keycloak.
      fields: [members]
  fields:
    name:
      placeholder: project-leads
      help:
        en: The short name a role binding gives this group by; it cannot be renamed later.
        sk: Krátky názov, ktorým skupinu pomenuje väzba roly; neskôr sa nedá premenovať.
        cs: Krátký název, kterým skupinu pojmenuje vazba role; později jej nelze přejmenovat.
        de: Der kurze Name, unter dem eine Rollenbindung die Gruppe gibt; später unveränderlich.
    description:
      placeholder: The people who lead the city's projects
      help:
        en: What this group is, for whoever reviews a binding that names it.
        sk: Čo je táto skupina, pre toho, kto posudzuje väzbu, ktorá ju menuje.
        cs: Co je tato skupina, pro toho, kdo posuzuje vazbu, jež ji jmenuje.
        de: Was diese Gruppe ist, für alle, die eine Bindung darauf prüfen.
    members[].user:
      placeholder: "name.surname@{orgDomain}"
      help:
        en: One person's address, as the identity provider spells it; nobody is listed twice.
        sk: Adresa jednej osoby tak, ako ju píše poskytovateľ identity; nikto nie je uvedený dvakrát.
        cs: Adresa jedné osoby tak, jak ji píše poskytovatel identity; nikdo není uveden dvakrát.
        de: Die Adresse einer Person, wie der Identitätsanbieter sie schreibt; niemand doppelt.
