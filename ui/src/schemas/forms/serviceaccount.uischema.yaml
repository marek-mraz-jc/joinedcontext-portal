# Default form arrangement for ServiceAccount (UI-02, T-2342).
# A workload's identity: a Keycloak client or a hashed key, never a secret in the manifest (PF-34…PF-37).
apiVersion: joinedcontext.com/v1alpha1
kind: UiSchema
metadata:
  name: serviceaccount
spec:
  for: ServiceAccount
  guide: User-Guide/07-users-roles-approvals
  about:
    en: >-
      A service account is the identity a program uses instead of a person: a sensor gateway, a
      partner's importer, a nightly export. Say who answers for it and why it exists, what it may
      do and where, and how it signs in; its secret is issued afterwards and never written here.
    sk: >-
      Servisný účet je identita, ktorú namiesto človeka používa program: brána senzorov, import
      partnera, nočný export. Uveďte, kto zaň zodpovedá a prečo existuje, čo a kde smie robiť a ako
      sa prihlasuje; jeho tajomstvo sa vydá neskôr a nikdy sa sem nezapisuje.
    cs: >-
      Servisní účet je identita, kterou místo člověka používá program: brána senzorů, import
      partnera, noční export. Uveďte, kdo za něj odpovídá a proč existuje, co a kde smí dělat a jak
      se přihlašuje; jeho tajemství se vydá později a nikdy se sem nezapisuje.
    de: >-
      Ein Dienstkonto ist die Identität, die ein Programm statt eines Menschen nutzt: ein
      Sensor-Gateway, ein Partner-Import, ein nächtlicher Export. Nennen Sie Verantwortliche, Zweck,
      Rechte und Anmeldung; das Geheimnis wird danach ausgegeben und nie hier eingetragen.
  order: [name, purpose, owner, roles, credentials, limits, workload]
  groups:
    - title:
        en: Who and why
        sk: Kto a prečo
        cs: Kdo a proč
        de: Wer und warum
      description:
        en: The account's name, the reason it exists and the person who answers for it.
        sk: Názov účtu, dôvod, prečo existuje, a osoba, ktorá zaň zodpovedá.
        cs: Název účtu, důvod, proč existuje, a osoba, která za něj odpovídá.
        de: Der Name des Kontos, warum es existiert und wer dafür verantwortlich ist.
      fields: [name, purpose, owner]
    - title:
        en: What it may do
        sk: Čo smie robiť
        cs: Co smí dělat
        de: Was es darf
      description:
        en: Each grant is one role on one project, space or organization, narrowed to operations and types.
        sk: Každé oprávnenie je jedna rola na jednom projekte, priestore alebo organizácii, zúžená na operácie a typy.
        cs: Každé oprávnění je jedna role na jednom projektu, prostoru nebo organizaci, zúžená na operace a typy.
        de: Jede Berechtigung ist eine Rolle auf einem Projekt, Raum oder einer Organisation, eingegrenzt.
      fields: [roles]
    - title:
        en: How it signs in
        sk: Ako sa prihlasuje
        cs: Jak se přihlašuje
        de: Wie es sich anmeldet
      description:
        en: The credentials the account may use; the value of each is issued after approval, not here.
        sk: Prihlasovacie údaje, ktoré účet smie použiť; ich hodnota sa vydá po schválení, nie tu.
        cs: Přihlašovací údaje, které účet smí použít; jejich hodnota se vydá po schválení, ne zde.
        de: Die Zugangsdaten des Kontos; ihr Wert wird nach der Genehmigung ausgegeben, nicht hier.
      fields: [credentials]
    - title:
        en: Limits and workload
        sk: Limity a úloha v klastri
        cs: Limity a úloha v clusteru
        de: Grenzen und Workload
      description:
        en: A rate limit for the account, and the cluster workload it runs as, when it runs inside.
        sk: Limit požiadaviek účtu a úloha v klastri, pod ktorou beží, ak beží vnútri.
        cs: Limit požadavků účtu a úloha v clusteru, pod kterou běží, pokud běží uvnitř.
        de: Ein Ratenlimit für das Konto und der Cluster-Workload, falls es darin läuft.
      folded: true
      fields: [limits, workload]
  fields:
    name:
      placeholder: bb-senzory-import
      help:
        en: The short name of the account; its Keycloak client is named after it and the project.
        sk: Krátky názov účtu; podľa neho a projektu sa pomenuje jeho klient v Keycloaku.
        cs: Krátký název účtu; podle něj a projektu se pojmenuje jeho klient v Keycloaku.
        de: Der kurze Name des Kontos; der Keycloak-Client wird nach ihm und dem Projekt benannt.
    purpose:
      placeholder: Nahráva merania senzorov ovzdušia z brány mesta každých 10 minút.
      help:
        en: Why this identity exists, in one sentence an auditor can check against what it does.
        sk: Prečo táto identita existuje, jednou vetou, ktorú audítor overí voči tomu, čo robí.
        cs: Proč tato identita existuje, jednou větou, kterou auditor ověří vůči tomu, co dělá.
        de: Warum diese Identität existiert, in einem Satz, den ein Prüfer nachvollziehen kann.
    owner.user:
      placeholder: jana.novakova@banskabystrica.sk
      help:
        en: The person who answers for this account, as they sign in; a program has no owner of its own.
        sk: Osoba, ktorá za účet zodpovedá, tak ako sa prihlasuje; program vlastníka sám nemá.
        cs: Osoba, která za účet odpovídá, tak jak se přihlašuje; program vlastníka sám nemá.
        de: Die verantwortliche Person, wie sie sich anmeldet; ein Programm hat keinen eigenen Eigentümer.
    roles[].role:
      placeholder: data-writer
      help:
        en: The role this grant gives, by the name of a Role manifest of this project.
        sk: Rola, ktorú toto oprávnenie dáva, podľa názvu manifestu Role tohto projektu.
        cs: Role, kterou toto oprávnění dává, podle názvu manifestu Role tohoto projektu.
        de: Die Rolle dieser Berechtigung, nach dem Namen eines Role-Manifests dieses Projekts.
    roles[].scope.level:
      help:
        en: Whether the grant reaches one project, one context space or the whole organization.
        sk: Či oprávnenie siaha na jeden projekt, jeden kontextový priestor alebo celú organizáciu.
        cs: Zda oprávnění sahá na jeden projekt, jeden kontextový prostor nebo celou organizaci.
        de: Ob die Berechtigung ein Projekt, einen Kontextraum oder die ganze Organisation erreicht.
    roles[].scope.name:
      placeholder: ovzdusie
      help:
        en: The name of that project, space or organization; the grant reaches nothing beyond it.
        sk: Názov toho projektu, priestoru alebo organizácie; za ním oprávnenie nesiaha.
        cs: Název toho projektu, prostoru nebo organizace; za něj oprávnění nesahá.
        de: Der Name dieses Projekts, Raums oder dieser Organisation; darüber hinaus gilt nichts.
    roles[].operations:
      help:
        en: The CIM 009 operations or groups the grant allows; empty leaves what the role itself says.
        sk: Operácie alebo skupiny CIM 009, ktoré oprávnenie dovoľuje; prázdne ponechá, čo hovorí rola.
        cs: Operace nebo skupiny CIM 009, které oprávnění dovoluje; prázdné ponechá, co říká role.
        de: Die erlaubten CIM-009-Operationen oder Gruppen; leer gilt, was die Rolle selbst sagt.
    roles[].types:
      placeholder: [AirQualityObserved]
      help:
        en: The entity types the grant is limited to; empty means every type the role allows.
        sk: Typy entít, na ktoré je oprávnenie obmedzené; prázdne znamená každý typ, ktorý rola dovolí.
        cs: Typy entit, na které je oprávnění omezeno; prázdné znamená každý typ, který role dovolí.
        de: Die Entitätstypen, auf die die Berechtigung begrenzt ist; leer bedeutet alle.
    credentials[].kind:
      help:
        en: A Keycloak client for anything that can do OAuth; an API key only for a legacy caller that cannot.
        sk: Klient v Keycloaku pre všetko, čo zvládne OAuth; kľúč API len pre starší systém, ktorý nie.
        cs: Klient v Keycloaku pro vše, co zvládne OAuth; klíč API jen pro starší systém, který ne.
        de: Ein Keycloak-Client für alles mit OAuth; ein API-Schlüssel nur für Altsysteme ohne.
    credentials[].name:
      placeholder: brana-mesta
      help:
        en: The name this credential is listed under; the key or client secret itself is issued later.
        sk: Názov, pod ktorým je údaj vedený; samotný kľúč alebo tajomstvo klienta sa vydá neskôr.
        cs: Název, pod kterým je údaj veden; samotný klíč nebo tajemství klienta se vydá později.
        de: Der Name, unter dem die Zugangsdaten geführt werden; der Schlüssel selbst kommt später.
    credentials[].expiresAt:
      placeholder: "2027-06-30T00:00:00Z"
      help:
        en: When this credential stops working, with its time zone; empty for no expiry.
        sk: Kedy údaj prestane platiť, aj s časovým pásmom; prázdne znamená bez vypršania.
        cs: Kdy údaj přestane platit, včetně časového pásma; prázdné znamená bez vypršení.
        de: Wann die Zugangsdaten ablaufen, mit Zeitzone; leer für kein Ablaufdatum.
    credentials[].ipAllowList:
      placeholder: [185.14.232.0/24]
      help:
        en: The address blocks this credential is accepted from; empty accepts it from anywhere.
        sk: Bloky adries, z ktorých sa údaj prijíma; prázdne ho prijme odkiaľkoľvek.
        cs: Bloky adres, ze kterých se údaj přijímá; prázdné jej přijme odkudkoli.
        de: Die Adressblöcke, aus denen die Zugangsdaten gelten; leer gilt von überall.
    limits.requestsPerMinute:
      placeholder: 600
      help:
        en: The most requests a minute this account may make; empty leaves the endpoint's own limit.
        sk: Najviac požiadaviek za minútu, ktoré účet smie urobiť; prázdne ponechá limit endpointu.
        cs: Nejvíce požadavků za minutu, které účet smí udělat; prázdné ponechá limit endpointu.
        de: Die höchste Anzahl Anfragen pro Minute; leer gilt das Limit des Endpoints.
    workload.kubernetes.namespace:
      placeholder: bb-senzory
      help:
        en: The cluster namespace of the workload that runs as this account, when it runs inside.
        sk: Menný priestor klastra, v ktorom beží úloha s týmto účtom, ak beží vnútri.
        cs: Jmenný prostor clusteru, ve kterém běží úloha s tímto účtem, pokud běží uvnitř.
        de: Der Cluster-Namespace des Workloads mit diesem Konto, falls er darin läuft.
    workload.kubernetes.serviceAccount:
      placeholder: importer
      help:
        en: The Kubernetes service account of that workload, whose token is exchanged for this identity.
        sk: Servisný účet Kubernetes tej úlohy, ktorého token sa vymení za túto identitu.
        cs: Servisní účet Kubernetes té úlohy, jehož token se vymění za tuto identitu.
        de: Das Kubernetes-Dienstkonto dieses Workloads, dessen Token gegen diese Identität getauscht wird.
