[advisories]
# See .cargo/audit.toml for the reasoning: `rsa` arrives with `openidconnect`, no fix exists,
# and only RSA private-key operations are affected. The portal only verifies with public keys.
# basic-toml 0.1.10 is unmaintained (not a vulnerability, RUSTSEC-2026-0374): a build-time read of
# i18n.toml inside age's i18n-embed-fl proc-macro (jcctl -> age 0.12.1 -> i18n-embed-fl 0.10.1 ->
# i18n-config 0.4.8, the newest of each). age decrypts the pipelines' SOPS files, so it stays; no
# release drops basic-toml yet. The platform's paste ignore (owner decision (a), T-3209) is the same case.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0374"]
[licenses]
# CDLA-Permissive-2.0 covers the Mozilla CA root data in `webpki-roots`, which arrives with
# reqwest's rustls-tls feature. It is a permissive data licence, not a code licence.
# MIT-0 is borrow-or-share, three levels under jcctl (jsonschema -> referencing -> fluent-uri).
# The platform allowed it for the same crate in T-0376; it is OSI-approved and attribution-free.
# 0BSD is quoted_printable's, under lettre (T-3583): OSI-approved, attribution-free like MIT-0.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "EUPL-1.2", "CC0-1.0", "MIT-0", "0BSD", "OpenSSL", "CDLA-Permissive-2.0"]
[bans]
multiple-versions = "warn"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/marek-mraz-jc/joinedcontext-platform",
  # The default broker's NGSI-LD crates, which the platform's context-gateway pulls in (T-3530)
  # from their own repository since T-3913, and the platform pin brings along (T-3539).
  "https://github.com/marek-mraz-jc/ngsild",
]
