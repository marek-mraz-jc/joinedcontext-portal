# The server component of alerts-heatmap (T-3351, ADR-N-044): wasm32-wasip2, exporting wasi:http,
# its database and files through jc:app. It reuses the browser's analysis (../wasm, without
# wasm-bindgen) for the weekly repeat places it keeps. Its own workspace and lock, as the App's
# repository builds it.
[package]
name = "alerts-heatmap-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "EUPL-1.2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alerts-heatmap = { path = "../wasm", default-features = false }
jc-app-sdk = { git = "https://github.com/marek-mraz-jc/joinedcontext-platform.git", rev = "2b2e1732bc448651836a2f455184bdf5c691893b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[workspace]
