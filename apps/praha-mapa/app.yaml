# Mapa Prahy — Prague's map for its residents (T-2786, AP-07, AP-14, UI-15). Hand written, so no
# generated-by annotation.
#
# It reads and never writes, so it is `static`: a bundle the Portal static host serves under
# /apps/praha-mapa/. Everything it shows is in the city's public space, read through a public
# endpoint, so the app never asks anybody to sign in and never holds a token (AP-28).
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: praha-mapa
  namespace: praha
  annotations:
    # The Portal image ships this bundle (Dockerfile, /srv/apps), so the App names no
    # repository of its own; the Portal accepts the mark only where the bundle is (AP-87).
    joinedcontext.com/shipped-with: portal
  title:
    cs: "Mapa Prahy"
    en: "Map of Prague"
  description:
    cs: "Školy, kultura, veřejné toalety, prodejní místa jízdenek PID a stanoviště tříděného odpadu na jedné mapě, s hledáním a detailem každého místa."
    en: "Schools, culture, public toilets, PID ticket points and recycling points on one map, with search and a detail of each place."
spec:
  kind: ui
  source:
    path: ./apps/praha-mapa
  build:
    node: "22"
  visibility: public
  lifecycle: published
  embeddable: true
  dataNeeds:
    # One space, two types, read only: the points of interest of the pipelines schools, culture,
    # toilets and ticket-points, and the isles of waste-stations (T-2785).
    - contextSpaceRef:
        kind: ContextSpace
        name: praha-mesto
      types: [PointOfInterest, WasteContainerIsle]
      attrs: [name, location, address, url, serviceCategory, facilityType, openingHours, wheelchairAccessible, capacity, pupilCount, stationCode, accessRestriction]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld]
