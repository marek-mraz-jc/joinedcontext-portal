apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: app-transit-reach-3
  namespace: helsinki
  annotations:
    joinedcontext.com/generated-by: portal/app-reconciler
spec:
  assignee:
    id: endpoint:helsinki/app-transit-reach
    kind: role
  assigner: did:web:hel.fi
  contextSpaceRef:
    kind: ContextSpace
    name: helsinki
  information:
  - entities:
    - type: TransitRoute
    propertyNames:
    - routeShortName
    - transportMode
    - stopSequence
    relationshipNames:
    - routeShortName
    - transportMode
    - stopSequence
  operations:
  - queryEntity
