apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: app-transit-reach-1-history
  namespace: helsinki
  annotations:
    joinedcontext.com/generated-by: portal/app-reconciler
spec:
  assignee:
    id: endpoint:helsinki/app-transit-reach
    kind: role
  assigner: did:web:hel.fi
  contextSpaceRef:
    kind: ContextSpace
    name: helsinki
  information:
  - entities:
    - type: Vehicle
    propertyNames:
    - location
    - speed
    - route
    relationshipNames:
    - location
    - speed
    - route
  operations:
  - retrieveTemporal
  temporalQ: timerel=after;timeAt=P-T6H
