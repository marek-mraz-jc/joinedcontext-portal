# Otvorené dáta o Žiline — the public datasets of the Žilina project as grids (T-3140, UI-64,
# UI-71, AP-07, AP-14): its own space and one more (AP-04), so the indicators are the dashboard
# zilina-ukazovatele's. Hand written, so no generated-by annotation.
#
# It reads and never writes, so it is `static`: a bundle the Portal static host serves under
# /apps/zilina-zaznamy/. Every dataset is public, read through the app's own endpoint of its
# space, so the app never asks anybody to sign in and never holds a token (AP-28).
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: zilina-zaznamy
  namespace: zilina
  annotations:
    # The Portal image ships this bundle (Dockerfile, /srv/apps), so the App names no
    # repository of its own; the Portal accepts the mark only where the bundle is (AP-87).
    joinedcontext.com/shipped-with: portal
  title:
    sk: "Otvorené dáta o Žiline"
    en: "Open data about Žilina"
  description:
    sk: "Pamiatky, železničné stanice, ovzdušie a publikácie univerzity ako tabuľky s filtrom v každom stĺpci a celým súborom na stiahnutie."
    en: "Monuments, railway stations, air quality and the university's works as tables with a filter in each column and the whole dataset to download."
spec:
  kind: ui
  source:
    path: ./apps/zilina-zaznamy
  build:
    node: "22"
  visibility: public
  lifecycle: published
  embeddable: true
  dataNeeds:
    # Each dataset's columns (ui/src/datasets.ts), read only.
    - contextSpaceRef:
        kind: ContextSpace
        name: zilina-verejne
      types: [PointOfInterest, GtfsStop, AirQualityObserved]
      attrs: [name, monumentKind, architecturalStyle, constructionPeriod, cadastralArea, ownershipForm, monumentNumber, address, dailyDepartures, stopCode, pm10, pm25, no2, o3, co, dateObserved]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld]
    - contextSpaceRef:
        kind: ContextSpace
        name: zilina-uniza
      types: [CreativeWork]
      attrs: [name, workType, yearPublished, isPartOf, publisher, license, url]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld]
