# The build of this application (AP-80, AP-100, AP-101, ADR-N-028). The Portal writes this file in
# the application's first commit and a run never changes it: only a version a reviewer merged
# runs. It builds the default branch on every push to it, and again when the Portal's Rebuild
# dispatches it (AP-103).
#
# Runs on the installation's `gitea-runner` (label node-22), whose image carries the SDK and the
# template's packages already installed, so nothing is installed here (AP-82). No step fetches an
# action: the runner reaches the forge and the Portal API only (AP-81), by the in-cluster
# addresses it gives every job as JC_FORGE_URL and JC_PORTAL_URL; `gitea.server_url` is the
# public host, which the runner cannot reach.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: node-22
    timeout-minutes: 20
    env:
      JC_BUILD_DIR: ${{ runner.temp }}/jc-build
    steps:
      # Clones the commit, runs the tests, builds and bundles the functions; the application's
      # own code runs here, with the job token removed from its environment.
      - name: Test and build
        env:
          JC_REPOSITORY: ${{ gitea.repository }}
          JC_APP_COMMIT: ${{ gitea.sha }}
          JC_FORGE_TOKEN: ${{ gitea.token }}
        run: JC_APP_REPO="$JC_FORGE_URL/$JC_REPOSITORY.git" build-app

      # The package `app-{name}`, version `{commit}`, written with this repository's job token.
      - name: Publish the package
        env:
          JC_FORGE_TOKEN: ${{ gitea.token }}
          JC_OWNER: ${{ gitea.repository_owner }}
          JC_REPOSITORY: ${{ gitea.repository }}
          JC_APP_COMMIT: ${{ gitea.sha }}
        run: publish-app

      # The one step that sees the lane's secret, and it runs no code of the application (AP-80).
      - name: Propose status.build
        env:
          JC_LANE_TOKEN: ${{ secrets.JC_LANE_TOKEN }}
          JC_REPOSITORY: ${{ gitea.repository }}
        run: node /opt/template/lane.mjs propose "$JC_REPOSITORY" "$JC_BUILD_DIR/build.json"
