# The city bike rebalancing planner (T-3328): which docking stations are about to run empty or
# full, and a route for one service van that moves bikes between them. Hand written, so no
# generated-by annotation (AP-35).
#
# A frontend only (`kind: ui`, no pod): React on the App SDK, and the planner in Rust compiled to
# WebAssembly, run in the reader's browser in a worker (wasm/). Its source is its own repository on
# the forge, which the build lane builds at `ref` (AP-75, AP-80); this folder of the portal
# repository is where CI tests the same tree before it is pushed there (T-2599).
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: bike-rebalancing
  namespace: helsinki
  title:
    en: "City bike rebalancing planner"
    fi: "Kaupunkipyörien tasaussuunnitelma"
  description:
    en: "Which docking stations are about to run empty or full, and a route for the service van that moves bikes between them, planned in the browser."
    fi: "Mitkä asemat ovat tyhjenemässä tai täyttymässä, ja huoltoauton reitti, joka siirtää pyöriä niiden välillä, laskettuna selaimessa."
spec:
  kind: ui
  source:
    git:
      url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_bike-rebalancing.git
      ref: main
  build:
    node: "22"
  # For the operator: the people of the project, viewer and steward alike.
  visibility: project
  lifecycle: published
  roles:
    - name: viewer
      title: { en: "Viewer", fi: "Katselija" }
      description: "Reads the stations and the planned route."
    - name: steward
      title: { en: "Steward", fi: "Ylläpitäjä" }
      description: "Plans the van's route; the app writes nothing, so a steward reads what a viewer reads."
  access:
    - role: viewer
      subjects: [{ group: bike-rebalancing-viewer }]
    - role: steward
      subjects: [{ group: bike-rebalancing-steward }]
  dataNeeds:
    - contextSpaceRef:
        kind: ContextSpace
        name: helsinki
      types: [BikeHireDockingStation]
      # What the bikes pipeline writes on dev (helsinki-pipeline-bikes-bento.yaml) and the planner
      # reads: the counts, the capacity, whether the station is in service and where it is.
      attrs: [name, location, availableBikeNumber, freeSlotNumber, totalSlotNumber, status, dateModified]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld]
