# The city bike rebalancing planner (T-3328, T-3346): which docking stations are about to run
# empty or full, and a route for one service van that moves bikes between them. Hand written, so
# no generated-by annotation (AP-35).
#
# A server WASM App (`kind: wasm`, ADR-N-044): React on the App SDK with the planner in Rust
# compiled to WebAssembly, run in the reader's browser while they click (wasm/); and a server
# component on the shared host (server/) that plans again from the gateway's counts when a plan is
# saved, keeps the plans and the drives in the App's own schema (migrations/) and the route sheets
# under its own prefix. Its source is its own repository on the forge, which the build lane builds
# at `ref` (AP-75, AP-80, AP-151); this folder of the portal repository is where CI tests the same
# tree before it is pushed there (T-2599).
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: bike-rebalancing
  namespace: helsinki
  title:
    en: "City bike rebalancing planner"
    fi: "Kaupunkipyörien tasaussuunnitelma"
  description:
    en: "Which docking stations are about to run empty or full, and a route for the service van that moves bikes between them, with saved plans, route sheets and the drives made."
    fi: "Mitkä asemat ovat tyhjenemässä tai täyttymässä, ja huoltoauton reitti, joka siirtää pyöriä niiden välillä, tallennetut suunnitelmat, reittilistat ja ajetut reitit."
spec:
  kind: wasm
  source:
    git:
      url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_bike-rebalancing.git
      ref: main
  build:
    node: "22"
    rust: "1.90"
  storage:
    sql: { migrations: migrations, quotaMiB: 100 }
    # Route sheets are a few kilobytes each.
    blob: { quotaMiB: 256 }
  # For the operator: the people of the project, viewer and steward alike.
  visibility: project
  lifecycle: published
  roles:
    - name: viewer
      title: { en: "Viewer", fi: "Katselija" }
      description: "Reads the stations, plans the van's route, saves plans and records drives."
    - name: steward
      title: { en: "Steward", fi: "Ylläpitäjä" }
      description: "What a viewer does: the server sees no role, so it gives a steward nothing more; the city's data is only read."
  access:
    - role: viewer
      subjects: [{ group: bike-rebalancing-viewer }]
    - role: steward
      subjects: [{ group: bike-rebalancing-steward }]
  dataNeeds:
    - contextSpaceRef:
        kind: ContextSpace
        name: helsinki
      types: [BikeHireDockingStation]
      # What the bikes pipeline writes on dev (helsinki-pipeline-bikes-bento.yaml) and the planner
      # reads: the counts, the capacity, whether the station is in service and where it is.
      attrs: [name, location, availableBikeNumber, freeSlotNumber, totalSlotNumber, status, dateModified]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld]
