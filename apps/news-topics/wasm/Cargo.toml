[package]
name = "news-topics-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
# Only the browser's module exports through wasm-bindgen; the server component (server/, T-3352)
# reuses the analysis without it.
wasm-bindgen = { version = "=0.2.129", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["browser"]
browser = ["dep:wasm-bindgen"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
