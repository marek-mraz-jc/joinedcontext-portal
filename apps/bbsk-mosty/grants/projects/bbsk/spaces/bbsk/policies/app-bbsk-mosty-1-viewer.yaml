apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: app-bbsk-mosty-1-viewer
  namespace: bbsk
  annotations:
    joinedcontext.com/generated-by: portal/app-reconciler
spec:
  assignee:
    id: endpoint:bbsk/app-bbsk-mosty/viewer
    kind: role
  assigner: did:web:bbsk.sk
  contextSpaceRef:
    kind: ContextSpace
    name: bbsk-registre
  information:
  - entities:
    - type: Bridge
    propertyNames:
    - name
    - bridgeCode
    - roadClass
    - roadNumber
    - yearBuilt
    - spanCount
    - bridgedLength
    - structureMaterial
    - heritageStatus
    - managerName
    - districtName
    - location
    relationshipNames:
    - name
    - bridgeCode
    - roadClass
    - roadNumber
    - yearBuilt
    - spanCount
    - bridgedLength
    - structureMaterial
    - heritageStatus
    - managerName
    - districtName
    - location
  operations:
  - queryEntity
  - retrieveEntity
