# The server component of event-day-planner (T-3347, ADR-N-044): a wasm32-wasip2 component on the
# shared host that keeps the days visitors share, under a short id, and their calendar files under
# the App's own prefix. It plans with the page's own planner (../wasm), without the browser's
# bindings. Its own workspace and lock, as the build lane builds it (AP-151).
[package]
name = "event-day-planner-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
event-day-planner = { path = "../wasm", default-features = false }
# The guest SDK at the platform commit that carries `gateway` (AP-147).
jc-app-sdk = { git = "https://github.com/marek-mraz-jc/joinedcontext-platform.git", rev = "263c41169d7f02dcbfa86024234686b4bb534500" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[workspace]
