apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: app-air-quality-1
  namespace: helsinki
  annotations:
    joinedcontext.com/generated-by: portal/app-reconciler
spec:
  assignee:
    id: endpoint:helsinki/app-air-quality
    kind: role
  assigner: did:web:hel.fi
  contextSpaceRef:
    kind: ContextSpace
    name: helsinki
  information:
  - entities:
    - type: AirQualityObserved
    propertyNames:
    - name
    - location
    - dateObserved
    - pm10
    - pm25
    - airQualityIndex
    - stewardNote
    - source
    relationshipNames:
    - name
    - location
    - dateObserved
    - pm10
    - pm25
    - airQualityIndex
    - stewardNote
    - source
  operations:
  - queryEntity
  - retrieveEntity
  - queryTemporal
  temporalQ: timerel=after;timeAt=P-1D
