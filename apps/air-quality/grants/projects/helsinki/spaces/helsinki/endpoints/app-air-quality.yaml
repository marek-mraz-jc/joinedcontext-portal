apiVersion: joinedcontext.com/v1alpha1
kind: Endpoint
metadata:
  name: app-air-quality
  namespace: helsinki
  annotations:
    joinedcontext.com/generated-by: portal/app-reconciler
spec:
  allowedProjects:
  - helsinki
  audience: project-list
  callerRole: true
  contextSpaceRef:
    kind: ContextSpace
    name: helsinki
  enabledRepresentations:
  - ngsi-ld
  - geojson
  fileLimits:
    maxFileRows: 5000
  rateLimits:
    requestsPerMinute: 300
  roles:
  - name: viewer
    subjects:
    - user: demo.viewer@hel.fi
  - name: steward
    subjects:
    - user: demo.steward@hel.fi
  slug: 3jlwl5dg2oidblwqhc6qdi3zxl
