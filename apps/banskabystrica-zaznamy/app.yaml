# Záznamy mesta — the city's records, with the one attribute a person may write (AP-09, AP-40,
# AP-62, EP-14, T-2436). Hand written, so no generated-by annotation.
#
# It is `static`: a bundle the Portal serves under /apps/banskabystrica-zaznamy/ on the platform
# origin, so a write carries the person's own session and CSRF header and the gateway decides it
# (Architecture/16 §8). The application holds no credential of its own.
#
# The region's grid is the same bundle with its own manifest, `apps/bbsk-zaznamy`: which body's
# records a screen shows comes from the space its configuration names, never from its code.
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: banskabystrica-zaznamy
  namespace: banskabystrica
  annotations:
    # The Portal image ships this bundle (Dockerfile, /srv/apps), so the App names no
    # repository of its own; the Portal accepts the mark only where the bundle is (AP-87).
    joinedcontext.com/shipped-with: portal
  title:
    sk: "Záznamy mesta Banská Bystrica"
    en: "Records of the city of Banská Bystrica"
  description:
    sk: "Zverejnené štatistické riadky mesta po stranách, s filtrom v každom stĺpci, ktorý zodpovie endpoint. Čísla patria vydavateľovi a sú len na čítanie; upraviť sa dá poznámka správcu."
    en: "The city's published statistical rows by the page, with a filter on every column that the endpoint answers itself. The figures belong to the publisher and are read-only; the steward's note is what can be edited."
spec:
  kind: ui
  source:
    path: ./apps/banskabystrica-zaznamy
  build:
    node: "22"
  # Not public: the rows are somebody else's published data mirrored here, and the endpoint's
  # audience is `organization` (AP-18).
  visibility: project
  lifecycle: published
  embeddable: true
  dataNeeds:
    # One space, one type, and one write on one attribute — which is what puts this publication
    # in the red lane on purpose (AP-09, AP-39).
    - contextSpaceRef:
        kind: ContextSpace
        name: banskabystrica-mesto
      types: [StatisticalObservation]
      # The columns the table shows and filters on, and the one attribute it writes. A filter
      # names an attribute, so an attribute missing here is a filter the endpoint refuses.
      attrs: [indicator, refArea, refPeriod, value, unitText, dateObserved, stewardNote]
      operations: [queryEntity, retrieveEntity, updateAttrs]
      representations: [ngsi-ld]
