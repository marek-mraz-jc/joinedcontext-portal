apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: app-hsl-transport-4
  namespace: helsinki
  annotations:
    joinedcontext.com/generated-by: portal/app-reconciler
spec:
  assignee:
    id: endpoint:helsinki/app-hsl-transport
    kind: role
  assigner: did:web:hel.fi
  contextSpaceRef:
    kind: ContextSpace
    name: helsinki
  information:
  - entities:
    - type: Alert
    propertyNames:
    - name
    - description
    - severity
    - validFrom
    - validTo
    - refRoute
    - refStop
    - unknownReference
    - source
    relationshipNames:
    - name
    - description
    - severity
    - validFrom
    - validTo
    - refRoute
    - refStop
    - unknownReference
    - source
  operations:
  - queryEntity
