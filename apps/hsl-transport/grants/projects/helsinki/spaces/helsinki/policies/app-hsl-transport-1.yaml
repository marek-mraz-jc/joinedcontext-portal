apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: app-hsl-transport-1
  namespace: helsinki
  annotations:
    joinedcontext.com/generated-by: portal/app-reconciler
spec:
  assignee:
    id: endpoint:helsinki/app-hsl-transport
    kind: role
  assigner: did:web:hel.fi
  contextSpaceRef:
    kind: ContextSpace
    name: helsinki
  information:
  - entities:
    - type: Vehicle
    propertyNames:
    - location
    - heading
    - speed
    - route
    relationshipNames:
    - location
    - heading
    - speed
    - route
  operations:
  - queryEntity
  - retrieveEntity
