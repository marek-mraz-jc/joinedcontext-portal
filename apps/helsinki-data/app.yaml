# Helsingin avoin data — Helsinki's open data as grids (T-2788, AP-07, AP-14, UI-64). Hand written,
# so no generated-by annotation.
#
# It reads and never writes, so it is `static`: a bundle the Portal static host serves under
# /apps/helsinki-data/. The space and its endpoint are public, so the app never asks anybody to
# sign in and never holds a token (AP-28).
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: helsinki-data
  namespace: helsinki
  annotations:
    # The Portal image ships this bundle (Dockerfile, /srv/apps), so the App names no
    # repository of its own; the Portal accepts the mark only where the bundle is (AP-87).
    joinedcontext.com/shipped-with: portal
  title:
    fi: "Helsingin avoin data"
    en: "Helsinki open data"
  description:
    fi: "Palvelut, alueluvat, tapahtumat, liikennetiedotteet, pysäköintivyöhykkeet, kaupunginosat, vedenlämpö, ilmanlaatu ja tiesää taulukkoina: suodatin jokaisessa sarakkeessa, koodistot valittavina, rivin tiedot ja lataus CSV- ja GeoJSON-muodossa."
    en: "Services, area permits, events, traffic notices, parking zones, districts, water temperature, air quality and road weather as tables: a filter on every column, code lists picked, each row whole, and a CSV or GeoJSON download."
spec:
  kind: ui
  source:
    path: ./apps/helsinki-data
  build:
    node: "22"
  visibility: public
  lifecycle: published
  embeddable: true
  dataNeeds:
    # The city's public space with every column the grids show (never an event's contact point);
    # the downloads are the endpoint's own files, under the same grant (API/02 §3, §4).
    - contextSpaceRef:
        kind: ContextSpace
        name: helsinki
      types: [PointOfInterest, PublicAreaPermit, Event, Alert, ParkingZone, CityDistrict, WaterQualityObserved, AirQualityObserved, WeatherObserved]
      attrs: [name, serviceCategory, address, openingHours, url, dateModified, permitKind, permitStatus, permitNumber, permitStart, permitEnd, startDate, endDate, eventStatus, category, subCategory, dateIssued, validFrom, validTo, zoneKind, zoneCode, districtCode, divisionLevel, temperature, dateObserved, pm10, pm25, airQualityIndex, roadSurfaceTemperature, relativeHumidity, windSpeed, windDirection, precipitation]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld, csv, geojson]
