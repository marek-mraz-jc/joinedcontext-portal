# City bike stations, the mobility project's first application (T-3185, AP-04, AP-14, UI-15).
# Hand written, so no generated-by annotation.
#
# It reads and never writes, so it is `ui`: a bundle the Portal static host serves under
# /apps/bike-stations/. The stations live in the helsinki project; this project reads them through
# its SharedSpaceReference `city-bikes`, whose target Endpoint (`helsinki/helsinki-bikes`, public)
# every App of the project is served beside its own (jc-core `app::served_endpoints`). The data need
# below is the App's own Endpoint over its project's space, which the rule requires and which holds
# no station today; the page reads the stations through the shared one.
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: bike-stations
  namespace: helsinki-mobility
  annotations:
    # The Portal image ships this bundle (Dockerfile, /srv/apps), so the App names no
    # repository of its own; the Portal accepts the mark only where the bundle is (AP-87).
    joinedcontext.com/shipped-with: portal
  title:
    en: "City bike stations"
    fi: "Kaupunkipyöräasemat"
  description:
    en: "Free bikes and free docks at every HSL city bike station on a map and in a searchable list, read from the stations the helsinki project shares."
    fi: "Vapaat pyörät ja telineet jokaisella HSL:n kaupunkipyöräasemalla kartalla ja haettavana listana helsinki-projektin jakamista asemista."
spec:
  kind: ui
  source:
    path: ./apps/bike-stations
  build:
    node: "22"
  visibility: project
  lifecycle: published
  embeddable: true
  dataNeeds:
    - contextSpaceRef:
        kind: ContextSpace
        name: mobility
      types: [BikeHireDockingStation]
      attrs: [name, location, availableBikeNumber, freeSlotNumber, totalSlotNumber, status, dateModified]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld]
