# Air quality and weather (T-3330): how the weather moves the air, station by station: a pollutant
# series against a weather station's over common hours, rolling means, Pearson and Spearman
# correlation, and the readings far from the rest. Hand written, so no generated-by annotation
# (AP-35).
#
# A server WASM App (`kind: wasm`, ADR-N-044, T-3348): React on the App SDK with its Rust compiled
# to WebAssembly and run in the reader's browser while they click (wasm/), and a server component
# on the shared host (server/) that keeps each station's readings as hourly means, read from the
# App's own Endpoint only for the hours not yet kept, and keeps saved comparisons and CSV exports.
# Its own schema (migrations/) and its own files under its prefix are the App's alone. Its source
# is its own repository on the forge, which the build lane builds at `ref` (AP-75, AP-80, AP-151);
# this folder of the portal repository is where CI tests the same tree before it is pushed there
# (T-2599).
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: air-weather-explorer
  namespace: helsinki
  title:
    en: "Air quality and weather"
    fi: "Ilmanlaatu ja sää"
  description:
    en: "How the weather moves Helsinki's air quality: pollutants against wind, temperature, humidity and rain, hour by hour, with the correlations computed in the browser."
    fi: "Miten sää vaikuttaa Helsingin ilmanlaatuun: saasteet tuulta, lämpötilaa, kosteutta ja sadetta vasten tunneittain, korrelaatiot laskettuna selaimessa."
spec:
  kind: wasm
  source:
    git:
      url: https://dev.joinedcontext.com/git/joinedcontext/helsinki_air-weather-explorer.git
      ref: main
  build:
    node: "22"
    rust: "1.90"
  storage:
    sql: { migrations: migrations, quotaMiB: 100 }
    blob: { quotaMiB: 256 }
  visibility: public
  lifecycle: published
  # Who keeps places and marks readings faulty (T-3827); the server decides from identity::caller()
  # alone, and the city's data is only read.
  roles:
    - name: viewer
      title: { en: "Viewer", fi: "Katselija" }
      description: "Keeps places of their own: an air quality station, a pollutant and the level above which the page alerts them; changes and deletes their own."
    - name: steward
      title: { en: "Steward", fi: "Ylläpitäjä" }
      description: "What a viewer does, and marks a station's readings faulty for a period with a reason, shown to everyone and left out of every comparison. Reads the whole history."
  access:
    - role: viewer
      subjects: [{ group: air-weather-explorer-viewer }]
    - role: steward
      subjects: [{ group: air-weather-explorer-steward }]
  dataNeeds:
    # The stations HSY's feed writes (helsinki-pipeline-air-quality), with a week of history: the
    # attributes the air-quality app reads on dev.
    - contextSpaceRef:
        kind: ContextSpace
        name: helsinki
      types: [AirQualityObserved]
      attrs: [name, location, dateObserved, pm10, pm25, airQualityIndex]
      operations: [queryEntity, retrieveEntity, queryTemporal, retrieveTemporal]
      temporalQ:
        window: P7D
      representations: [ngsi-ld]
    # The weather stations the FMI and road-weather pipelines write (read on dev 2026-10-08:
    # temperature, windSpeed and relativeHumidity on every station, precipitation on road ones).
    - contextSpaceRef:
        kind: ContextSpace
        name: helsinki
      types: [WeatherObserved]
      attrs: [name, location, dateObserved, temperature, windSpeed, relativeHumidity, precipitation]
      operations: [queryEntity, retrieveEntity, queryTemporal, retrieveTemporal]
      temporalQ:
        window: P7D
      representations: [ngsi-ld]
