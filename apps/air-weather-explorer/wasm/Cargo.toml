# The statistics of air-weather-explorer, compiled to WebAssembly and run in the browser's
# worker (T-3330): no server holds it. Its own workspace, so the Portal's does not load it.
[package]
name = "air-weather-explorer"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The version the build lane binds with (builder/build-wasm.sh, AP-142).
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
