apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: app-air-weather-explorer-2-history
  namespace: helsinki
  annotations:
    joinedcontext.com/generated-by: portal/app-reconciler
spec:
  assignee:
    id: endpoint:helsinki/app-air-weather-explorer
    kind: role
  assigner: did:web:hel.fi
  contextSpaceRef:
    kind: ContextSpace
    name: helsinki
  information:
  - entities:
    - type: WeatherObserved
    propertyNames:
    - name
    - location
    - dateObserved
    - temperature
    - windSpeed
    - relativeHumidity
    - precipitation
    relationshipNames:
    - name
    - location
    - dateObserved
    - temperature
    - windSpeed
    - relativeHumidity
    - precipitation
  operations:
  - retrieveTemporal
  temporalQ: timerel=after;timeAt=P-7D
