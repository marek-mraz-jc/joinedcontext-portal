# Mapa Banskobystrického kraja — the region's map for its residents (T-2784, AP-07, AP-14, UI-15).
# Hand written, so no generated-by annotation.
#
# It reads and never writes, so it is `static`: a bundle the Portal static host serves under
# /apps/bbsk-mapa/. Everything it shows is in the region's public register space, read through a
# public endpoint, so the app never asks anybody to sign in and never holds a token (AP-28).
apiVersion: joinedcontext.com/v1alpha1
kind: App
metadata:
  name: bbsk-mapa
  namespace: bbsk
  annotations:
    # The Portal image ships this bundle (Dockerfile, /srv/apps), so the App names no
    # repository of its own; the Portal accepts the mark only where the bundle is (AP-87).
    joinedcontext.com/shipped-with: portal
  title:
    sk: "Mapa Banskobystrického kraja"
    en: "Map of the Banská Bystrica region"
  description:
    sk: "Nemocnice, verejné sociálne služby a organizácie kraja na jednej mape, s vyhľadávaním podľa názvu, adresy a okresu a s detailom každého miesta."
    en: "The hospitals, public social services and organizations of the region on one map, with search by name, address and district and a detail of each place."
spec:
  kind: ui
  source:
    path: ./apps/bbsk-mapa
  build:
    node: "22"
  visibility: public
  lifecycle: published
  embeddable: true
  dataNeeds:
    # One space, three types, read only: what the pipelines nemocnice, socialne-sluzby and
    # organizacie write (T-2783); the attributes the screen shows.
    - contextSpaceRef:
        kind: ContextSpace
        name: bbsk-registre
      types: [Hospital, SocialService, PublicOrganization]
      attrs: [name, location, address, districtName, url, hospitalKind, serviceForm, organizationCategory, operatorName, medicalSpecialties, serviceKind, targetGroup, capacity, providerKind]
      operations: [queryEntity, retrieveEntity]
      representations: [ngsi-ld]
