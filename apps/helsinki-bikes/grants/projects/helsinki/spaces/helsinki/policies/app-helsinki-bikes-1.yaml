apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: app-helsinki-bikes-1
  namespace: helsinki
  annotations:
    joinedcontext.com/generated-by: portal/app-reconciler
spec:
  assignee:
    id: endpoint:helsinki/app-helsinki-bikes
    kind: role
  assigner: did:web:hel.fi
  contextSpaceRef:
    kind: ContextSpace
    name: helsinki
  information:
  - entities:
    - type: BikeHireDockingStation
    propertyNames:
    - name
    - location
    - availableBikeNumber
    - freeSlotNumber
    - totalSlotNumber
    - status
    - dateModified
    relationshipNames:
    - name
    - location
    - availableBikeNumber
    - freeSlotNumber
    - totalSlotNumber
    - status
    - dateModified
  operations:
  - queryEntity
  - retrieveEntity
