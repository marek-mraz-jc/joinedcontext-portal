apiVersion: joinedcontext.com/v1alpha1
kind: Policy
metadata:
  name: app-bike-weather-demand-2-history
  namespace: helsinki
  annotations:
    joinedcontext.com/generated-by: portal/app-reconciler
spec:
  assignee:
    id: endpoint:helsinki/app-bike-weather-demand
    kind: role
  assigner: did:web:hel.fi
  contextSpaceRef:
    kind: ContextSpace
    name: helsinki
  information:
  - entities:
    - type: WeatherObserved
    propertyNames:
    - name
    - location
    - temperature
    - precipitation
    - dateObserved
    relationshipNames:
    - name
    - location
    - temperature
    - precipitation
    - dateObserved
  operations:
  - retrieveTemporal
  temporalQ: timerel=after;timeAt=P-7D
