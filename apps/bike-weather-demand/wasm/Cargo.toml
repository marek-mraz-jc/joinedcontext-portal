[package]
name = "bike-weather-demand"
version = "0.1.0"
edition = "2021"
publish = false
description = "Helsinki bike weather demand: availability profile, weather sensitivity and short-term estimate (T-3337)"
license = "EUPL-1.2"

# Its own workspace: the app's repository holds this crate alone, and the portal's root workspace
# leaves the app out.
[workspace]

[lib]
name = "bike_weather_demand"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the browser's module exports through wasm-bindgen; the server component (server/, T-3355)
# reuses the model without it.
wasm-bindgen = { version = "=0.2.129", optional = true }

[features]
default = ["browser"]
browser = ["dep:wasm-bindgen"]

[profile.release]
# The module is downloaded by every visitor: small over fast, one codegen unit, no unwinding.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
