# The server component of data-quality-inspector (T-3354, ADR-N-044): wasm32-wasip2, exporting wasi:http,
# its database and files through jc:app. It reuses the browser's inspection (../wasm, without
# wasm-bindgen) for the quality runs it keeps. Its own workspace and lock, as the App's
# repository builds it.
[package]
name = "data-quality-inspector-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "EUPL-1.2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
data-quality-inspector = { path = "../wasm", default-features = false }
jc-app-sdk = { git = "https://github.com/marek-mraz-jc/joinedcontext-platform.git", rev = "a7f62e42cf0e2eb88e1bd69d1f6219a9fb136a17" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[workspace]
