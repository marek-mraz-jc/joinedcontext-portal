[package]
name = "kpi-forecast"
version = "0.1.0"
edition = "2021"
publish = false
description = "Every Helsinki KPI with its trend, a short forecast and the points that look wrong, computed in the browser (T-3332)"
license = "EUPL-1.2"

# Its own workspace: the app's repository holds this crate alone, and the portal's root workspace
# leaves the app out.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[profile.release]
# The module is downloaded by every visitor: small over fast, one codegen unit, no unwinding.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
