# The computing part of the React + Rust/WebAssembly example (T-3327, AP-142): compiled to
# wasm32-unknown-unknown by the build lane and bound with `wasm-bindgen --target web` before
# `vite build`. Its own crate with its own lock, so this folder is an App repository as it is.
[package]
name = "jc-wasm-example"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The build lane's wasm-bindgen-cli is this exact version; the lane refuses another.
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Not a member of the Portal's workspace: the App builds from this folder alone.
[workspace]
