# The server half of a generated `wasm` App (T-3575, ADR-N-044): a wasm32-wasip2 component on the
# shared host, built by the lane's build-component (AP-151). Its own workspace and lock; every
# crate it locks is in the app-build-rust runner's store.
[package]
name = "app-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "EUPL-1.2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The guest SDK at the platform commit the reference server Apps pin (AP-147).
jc-app-sdk = { git = "https://github.com/marek-mraz-jc/joinedcontext-platform.git", rev = "9d6378b2b21b45917b6fb1653ff6fbb8701d021f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[workspace]
