# The Portal UI calls its API through openapi-fetch (ui/src/api/client.ts): `client.GET("/api/v1/…")`
# with the path as openapi-typescript generated it, so the literal is the route's own spelling.
[[link]]
name = "ui-openapi-fetch"
channel = "http"
role = "uses"
files = ["ui/src/**/*.ts", "ui/src/**/*.tsx"]
pattern = '''\.(?P<verb>GET|POST|PUT|PATCH|DELETE|HEAD)\(\s*[`"'](?P<key>/[^`"']+)[`"']'''
key = "{verb} {key}"

# Calls no regex keys: a path held in a constant, a template URL handed to EventSource or a raw
# fetch, a URL a page loads (img, favicon, iframe, navigation), and the App SDK's relative paths.
# Each names the function that makes the call.

# data views: openapi-fetch through the LIST/ONE constants
[[endpoint]]
channel = "http"
role = "uses"
key = "GET /api/v1/projects/{p}/spaces/{s}/views"
symbol = "ui/src/api/dataViews.ts::listViews"
[[endpoint]]
channel = "http"
role = "uses"
key = "POST /api/v1/projects/{p}/spaces/{s}/views"
symbol = "ui/src/api/dataViews.ts::createView"
[[endpoint]]
channel = "http"
role = "uses"
key = "PUT /api/v1/projects/{p}/spaces/{s}/views/{id}"
symbol = "ui/src/api/dataViews.ts::updateView"
[[endpoint]]
channel = "http"
role = "uses"
key = "DELETE /api/v1/projects/{p}/spaces/{s}/views/{id}"
symbol = "ui/src/api/dataViews.ts::deleteView"

