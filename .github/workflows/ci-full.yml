name: ci-full
# the slow lane: runs once an hour on main and on demand; never a PR gate.
# The MVP pushes to main many times an hour, and a full run per push queued behind the next
# one; ci.yml stays the per-push gate. tasks/ci files a task for a red hourly run like any other.
# To put the per-push trigger back: add `push: { branches: [main] }` under `on:`.
on:
  schedule: [{ cron: "7 */3 * * *" }]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-full-${{ github.ref }}", cancel-in-progress: false }
jobs:
  test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The Portal's own PostgreSQL. Without it every test gated on
    # JC_PORTAL_TEST_DATABASE_URL skips itself, so the key store, the preferences and the
    # builder-run tables were covered by tests that never ran (T-2063, T-2064). The fast `ci`
    # lane keeps no service: it stays under five minutes and these are not its cases.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jc
          POSTGRES_PASSWORD: jc
          POSTGRES_DB: jc_portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The kit bundle is embedded at build time (sdk/dist, ignored in git); the integration
      # tests under tests/ take the preview branch only when it is there, so the slow lane
      # builds it first and tests the Portal as it ships (AP-56, AP-63).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: sdk/pnpm-lock.yaml }
      - run: cd sdk && pnpm install --frozen-lockfile && pnpm build
      # Every test binary runs: without --no-fail-fast the first failing one hid the rest
      # (resource_mutate_tests was red for hours behind kit_pass_tests, T-2859).
      - run: cargo test --workspace --all-targets --all-features --no-fail-fast
        env:
          JC_PREVIEW_OUT: "${{ runner.temp }}/preview"
          JC_PORTAL_TEST_DATABASE_URL: postgres://jc:jc@127.0.0.1:5432/jc_portal_test
      # The template's preview document, as the test above wrote it, rendered in a sandboxed
      # frame with its own policy (SDK-16, T-0678).
      - run: cd sdk && pnpm exec playwright install --with-deps chromium && pnpm e2e
        env: { JC_PREVIEW_OUT: "${{ runner.temp }}/preview" }
      - run: cargo doc --workspace --no-deps
        env: { RUSTDOCFLAGS: "-D warnings" }
  readme:
    # Every command the README tells a newcomer to type is run here (T-2144, TS-19). A
    # renamed crate, a moved script or a flag that no longer exists then fails a lane rather
    # than somebody's first hour. Only the Build and Test sections run; "Run locally" starts
    # a server and is read by eye.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: the extractor reads what it is meant to read
        run: python3 scripts/ci/check-readme-commands.py --selftest
      - run: python3 scripts/ci/check-readme-commands.py
  ui-coverage:
    # What the UI suite covers, measured and never targeted (T-2136, TS-01). The thresholds in
    # `ui/vite.config.ts` are what it reached when they were written, so the number can rise and
    # cannot fall. Not in the fast lane: instrumenting every module costs more than its budget.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: has
        run: echo "ui=$([ -f ui/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.ui == 'yes'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - if: steps.has.outputs.ui == 'yes'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      # The SDK first, for the reason the fast lane gives: the UI links its sources (T-1439).
      - if: steps.has.outputs.ui == 'yes'
        run: cd sdk && pnpm install --frozen-lockfile
      - if: steps.has.outputs.ui == 'yes'
        run: cd ui && pnpm install --frozen-lockfile && pnpm vitest run --coverage
      - if: steps.has.outputs.ui == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: ui-coverage, path: ui/coverage, if-no-files-found: error }
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with: { tool: "cargo-audit,cargo-deny" }
      - run: cargo audit
      - run: cargo deny check advisories bans licenses sources
  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: has
        run: echo "ui=$([ -f ui/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.ui == 'yes'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { version: 10 }
      - if: steps.has.outputs.ui == 'yes'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      # The SDK before the UI, for the same reason the fast lane does it (T-1439): the UI links the
      # SDK's sources and `link:` installs nothing for the sibling, so the Vite build behind these
      # journeys cannot resolve the SDK's own dependencies — `maplibre-gl` is the one that failed.
      - if: steps.has.outputs.ui == 'yes'
        run: cd sdk && pnpm install --frozen-lockfile
      - if: steps.has.outputs.ui == 'yes'
        run: cd ui && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm e2e
      # A red lane that leaves nothing behind cannot be fixed by whoever reads it. The trace and
      # the actual screenshot are the only way to tell an intended visual change — whose golden
      # then wants regenerating — from a layout that broke, and this lane is the one place with
      # a browser that works, so the images cannot be produced anywhere else (T-2311).
      - if: always() && steps.has.outputs.ui == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: |
            ui/test-results/
            ui/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - if: steps.has.outputs.ui == 'no'
        run: echo "no ui/package.json yet"
      # The reference apps run their flows against their own binary, so the toolchain has to
      # be here too (AP-34, AP-40).
      - if: steps.has.outputs.ui == 'yes'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - if: steps.has.outputs.ui == 'yes'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: steps.has.outputs.ui == 'yes'
        name: the reference app flows
        # Built first: the SDK-template apps serve their own `dist/` (their playwright config says
        # so), and without it every flow met an empty page (T-2946).
        run: |
          set -eu
          for app in apps/*/ui; do
            [ -f "$app/playwright.config.ts" ] || continue
            (cd "$app" && pnpm install --frozen-lockfile && pnpm build \
              && pnpm exec playwright install --with-deps chromium && pnpm e2e)
          done
      # The same flows for an application at the root of its own repository (T-2596), built from
      # the tree copied out with the SDK linked from this checkout, as the fast lane tests it.
      - if: steps.has.outputs.ui == 'yes'
        name: the flows of the applications in their own repository
        run: |
          set -eu
          for app in apps/*/; do
            [ -f "$app/playwright.config.ts" ] || continue
            work=$(mktemp -d)
            cp -r "$app". "$work"
            (cd "$work" && npm pkg set "dependencies.@joinedcontext/sdk=link:$GITHUB_WORKSPACE/sdk" \
              && pnpm install --no-frozen-lockfile && pnpm build \
              && pnpm exec playwright install --with-deps chromium && pnpm e2e)
          done
