# Display name `ship` (T-4721); the file keeps its name because pin-images verifies the signing
# identity `.github/workflows/image.yml@refs/heads/main` and tasks/ci finds runs by it.
name: ship
# Builds, signs and pushes the Portal's two images, the binary and the `portal-ui` bundle it reads
# its pages from (T-2485), and the build lane's images (AP-82: the builder carries the SDK of the
# same commit), after each green ci on main and on tags. A run builds only what the paths changed
# since the last green build need (dev/image-matrix.py); a ui/-only change builds the bundle alone
# (T-6158: ~2 min instead of the binary's ~11), and pin-images keeps the binary pinned for it.
# The binary's image runs as its own chain (bundles -> compile -> portal, T-6154), beside the
# matrix, so the bundle and builder images never wait for it and its dependencies stay compiled
# in rust-cache.
# No hourly wait since T-6108 (owner: a merge reaches dev within the hour): T-4696's hourly gate
# saved billed minutes, and the repository is public, so Actions minutes cost nothing. The gate's
# concurrency group still keeps one run deciding and the newest commit pending behind it, so builds
# run back to back on the newest main. pin-images (deployment) pins the newest commit this lane built.
# A green ci on main starts a run (T-5449): GitHub's cron fired none of the 05:37-08:37Z slots on
# 2026-10-23, so the cron stays only as a fallback.
on:
  schedule: [{ cron: "37 * * * *" }]
  # ci completed: the green main commit. ci-full requested: the daily ci-full's commit gets its
  # images too, so promote.yml can attest the tested digest. The other two pairs (ci requested,
  # ci-full completed) end as skipped runs at `changes`' if.
  workflow_run: { workflows: [ci, ci-full], types: [requested, completed], branches: [main] }
  push:
    tags: ["v*"]
  workflow_dispatch:
# Read-only by default: only a job that publishes may hold the permissions that push an image
# under the project's name and mint its signing identity (T-0851).
permissions: { contents: read }
# NOT cancel-in-progress, unlike the test lanes: this lane's output is an artifact, not a
# verdict, and `dev-apply` deploys it. With merges a few minutes apart, cancelling killed five
# builds in a row on 2026-09-20 and `:main` stayed on the one commit that happened to be
# followed by a quiet five minutes, which is not how `dev` trails `main` by an hour (T-2318).
# Main runs are keyed by commit (T-5024, as ci.yml in T-5022): GitHub keeps one pending run per
# concurrency group, so with image-<ref> each merge replaced the pending main run and most main
# commits got no image to pin. Every main commit now publishes its own `:sha`; runs may overlap,
# so `:main` can briefly name an older commit. Deployments pin digests, never `:main`.
concurrency:
  group: "image-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}"
  cancel-in-progress: false
jobs:
  changes:
    # workflow_run runs main's workflow with its secrets whatever triggered it: only a green ci of
    # a push to main in this repository, on the commit main still points at (a newer commit's ci
    # comes after), and ci-full's request start a build; github.sha is always main's head.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.name == 'ci-full' && github.event.action == 'requested') ||
      (github.event.workflow_run.name == 'ci' && github.event.action == 'completed' &&
       github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run decides at the gate, the newest commit pends behind it and replaces an older pending
    # one; the replaced run ends cancelled, its commit is in the newer one. ci-full's request, a
    # tag and a dispatch never queue here.
    concurrency:
      group: "${{ (github.event_name == 'schedule' || github.event.workflow_run.name == 'ci') && 'image-gate' || format('image-gate-{0}', github.run_id) }}"
      cancel-in-progress: false
    # actions: read finds the last green build (T-4696).
    permissions: { contents: read, actions: read }
    # matrix: the images built from their Dockerfile alone; portal: whether the binary's image is
    # built too, by the bundles -> compile -> portal jobs (T-6154).
    outputs: { matrix: "${{ steps.pick.outputs.matrix }}", portal: "${{ steps.pick.outputs.portal }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      # The cron, a green ci and ci-full's request build what changed since the newest green run of this lane on
      # main, nothing when main has not moved since; a tag, a dispatch or a last build git cannot
      # diff builds everything.
      # promote.yml attests the binary of ci-full's own commit: when that commit built only the
      # bundle (a ui/-only push), ci-full's request adds the binary (T-6158).
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          paths=ALL
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_run ]; then
            built=$(python3 scripts/ci/image-gate.py "$GITHUB_REPOSITORY" "$GITHUB_SHA" 0)
            if [ "$built" = "$GITHUB_SHA" ]; then
              paths=""
            elif [ -n "$built" ] && git cat-file -e "${built}^{commit}" 2>/dev/null; then
              paths=$(git diff --name-only "$built" "$GITHUB_SHA")
            fi
          fi
          binary=""
          if [ "$WORKFLOW" = ci-full ] && ! docker buildx imagetools inspect "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_SHA" >/dev/null 2>&1; then
            binary=--binary
          fi
          printf '%s\n' "$paths" ${binary:+"(and the binary ci-full attests)"}
          all=$(printf '%s\n' "$paths" | python3 dev/image-matrix.py "${{ github.repository }}" "${{ github.repository_owner }}" $binary)
          echo "matrix=$(jq -c '{include: [.include[] | select(.name != "portal")]}' <<<"$all")" >> "$GITHUB_OUTPUT"
          echo "portal=$(jq -c 'any(.include[]; .name == "portal")' <<<"$all")" >> "$GITHUB_OUTPUT"
  build:
    needs: changes
    if: fromJSON(needs.changes.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: |
            APT_REFRESH=${{ steps.day.outputs.d }}
            JC_PORTAL_COMMIT=${{ github.sha }}
          push: true
          # dev-<N>: built and smoke-tested; the full-test promote adds :<N> and :latest (T-4721)
          tags: ${{ matrix.image }}:${{ github.sha }},${{ matrix.image }}:main,${{ matrix.image }}:dev-${{ github.run_number }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true
      # AP-142: the rust runner builds the SDK's React + Rust/WebAssembly example to a static
      # bundle, offline, its browser checks included, before the image is signed.
      - if: matrix.name == 'app-builder-rust'
        name: the rust runner builds a ui App with WebAssembly
        run: |
          docker run --rm -v "$PWD/sdk/examples/react-rust-wasm:/src:ro" -v "$PWD/builder/lane-wasm-check.sh:/lane-wasm-check.sh:ro" \
            --entrypoint sh "${{ matrix.image }}@${{ steps.push.outputs.digest }}" /lane-wasm-check.sh
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - run: cosign sign --yes ${{ matrix.image }}@${{ steps.push.outputs.digest }}
      - run: echo "${{ matrix.name }} digest ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
  # The binary (T-6154): compiled once in the runner, where rust-cache keeps every compiled
  # dependency (Docker's gha layer cache lost them on each Cargo.lock move: 270 s cold, then the
  # Portal crate). `bundles` exports the two bundles the binary embeds from the Dockerfile's own
  # stages and layer cache, so they are the bytes a plain `docker build` embeds.
  bundles:
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: bundles
          build-args: JC_PORTAL_COMMIT=${{ github.sha }}
          outputs: type=local,dest=${{ runner.temp }}/bundles
          cache-from: |
            type=gha,scope=portal
            type=gha,scope=portal-ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: bundles, path: "${{ runner.temp }}/bundles", retention-days: 1, if-no-files-found: error }
  compile:
    needs: bundles
    runs-on: ubuntu-latest
    # The Dockerfile's build stage base, so the binary links the glibc the runtime image carries.
    container: rust:1.97-slim-trixie@sha256:8e8cf8f7fd54a2d23d5a743b3a03f56e26b6c774276c33fa0595111704ebb15c
    permissions: { contents: read }
    timeout-minutes: 30
    # What GET /api/v1/version and the /docs footer name (option_env!, as the Dockerfile's ARG).
    env: { JC_PORTAL_COMMIT: "${{ github.sha }}" }
    steps:
      # the build stage's `make` (tikv-jemalloc-sys), plus git and zstd for checkout and the cache
      - run: apt-get update && apt-get install -y --no-install-recommends make git zstd && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: bundles, path: . }
      - run: test -s ui/dist/index.html && test -s ui/dist/version.json && test -s sdk/dist/kit.js
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { shared-key: image-release, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      # The Dockerfile's `build` stage filesystem: the binary at /joinedcontext-portal.
      - run: |
          cargo build --release --locked -p joinedcontext-portal
          mkdir -p dist && install -m 0755 target/release/joinedcontext-portal dist/joinedcontext-portal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: binary, path: dist, retention-days: 1, if-no-files-found: error }
  portal:
    needs: compile
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    timeout-minutes: 20
    env: { IMAGE: "ghcr.io/${{ github.repository }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: binary, path: "${{ runner.temp }}/build" }
      # an artifact drops the mode bits
      - run: chmod 0755 "$RUNNER_TEMP/build/joinedcontext-portal"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # T-4721: the binary starts and answers before anything is pushed. `build-contexts` stands the
      # compiled binary in for the Dockerfile's `build` stage, which then never runs.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-contexts: build=${{ runner.temp }}/build
          build-args: |
            APT_REFRESH=${{ steps.day.outputs.d }}
            JC_PORTAL_COMMIT=${{ github.sha }}
          load: true
          tags: portal-local:latest
          cache-from: type=gha,scope=portal
      - name: the Portal starts and serves /healthz, an anonymous page and its version
        run: |
          docker run -d --name portal -p 8080:8080 portal-local:latest
          fail() { echo "SMOKE: $1"; docker logs portal | tail -40; exit 1; }
          for _ in $(seq 30); do curl -sf localhost:8080/healthz >/dev/null && break; sleep 1; done
          curl -sf localhost:8080/healthz >/dev/null || fail "/healthz not 200 after 30 s"
          curl -sfL localhost:8080/ | grep -qi '<html' || fail "/ serves no page"
          curl -sf localhost:8080/api/v1/version | jq -e --arg c "$GITHUB_SHA" '.portal.commit == $c and .contract == "match"' >/dev/null \
            || fail "/api/v1/version does not name $GITHUB_SHA with a matching embedded bundle"
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/projects)
          [ "$code" = 401 ] || fail "/api/v1/projects without a token answered $code, not 401"
          echo "healthz 200, / page, version names the commit and its bundle matches, projects 401 without a token"
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-contexts: build=${{ runner.temp }}/build
          build-args: |
            APT_REFRESH=${{ steps.day.outputs.d }}
            JC_PORTAL_COMMIT=${{ github.sha }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:main,${{ env.IMAGE }}:dev-${{ github.run_number }}
          cache-from: type=gha,scope=portal
          cache-to: type=gha,mode=max,scope=portal
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
      - run: echo "portal digest ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
  # Starts pin-images in the deployment once the images are signed (T-6154); the scans run after
  # this lane in image-scan.yml. workflow_run does not cross repositories: a repository_dispatch with
  # DEPLOYMENT_DISPATCH_TOKEN (fine-grained, contents: write on the deployment only); without it
  # pin-images still runs on its cron.
  notify:
    needs: [build, bundles, compile, portal]
    # either half may have nothing to build (skipped); a failed or cancelled one pins nothing
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    env:
      TOKEN: ${{ secrets.DEPLOYMENT_DISPATCH_TOKEN }}
    steps:
      - run: |
          set -eu
          [ -n "$TOKEN" ] || { echo "no DEPLOYMENT_DISPATCH_TOKEN: pin-images picks this commit up on its cron"; exit 0; }
          curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/joinedcontext-deployment/dispatches" \
            -d "{\"event_type\":\"image-pushed\",\"client_payload\":{\"repository\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\"}}"
