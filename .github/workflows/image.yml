# Display name `ship` (T-4721); the file keeps its name because pin-images verifies the signing
# identity `.github/workflows/image.yml@refs/heads/main` and tasks/ci finds runs by it.
name: ship
# Builds, signs and pushes the Portal's two images, the binary and the `portal-ui` bundle it reads
# its pages from (T-2485), and the build lane's images (AP-82: the builder carries the SDK of the
# same commit), on every push to main and on tags. A push builds only what its paths need
# (dev/image-matrix.py); a ui/-only push builds the bundle and, until the cut-over, the binary.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
# Read-only by default: only a job that publishes may hold the permissions that push an image
# under the project's name and mint its signing identity (T-0851).
permissions: { contents: read }
# NOT cancel-in-progress, unlike the test lanes: this lane's output is an artifact, not a
# verdict, and `dev-apply` deploys it. With merges a few minutes apart, cancelling killed five
# builds in a row on 2026-09-20 and `:main` stayed on the one commit that happened to be
# followed by a quiet five minutes, which is not how `dev` trails `main` by an hour (T-2318).
# Queued per ref, so each run publishes its own `:sha` and moves `:main` in order.
concurrency: { group: "image-${{ github.ref }}", cancel-in-progress: false }
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { matrix: "${{ steps.pick.outputs.matrix }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      # A tag, a dispatch, the first push of a branch or a rewritten range builds everything.
      - id: pick
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = push ] && [ "${REF#refs/tags/}" = "$REF" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            paths=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            paths=ALL
          fi
          printf '%s\n' "$paths"
          echo "matrix=$(printf '%s\n' "$paths" | python3 dev/image-matrix.py "${{ github.repository }}" "${{ github.repository_owner }}")" >> "$GITHUB_OUTPUT"
  build:
    needs: changes
    if: fromJSON(needs.changes.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # T-4721: the binary starts and answers before anything is pushed. Built into the local
      # daemon from the same cache; the push build below reuses the builder's layers.
      - if: matrix.name == 'portal'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            APT_REFRESH=${{ steps.day.outputs.d }}
            JC_PORTAL_COMMIT=${{ github.sha }}
          load: true
          tags: portal-local:latest
          cache-from: type=gha,scope=${{ matrix.name }}
      - if: matrix.name == 'portal'
        name: the Portal starts and serves /healthz, an anonymous page and its version
        run: |
          docker run -d --name portal -p 8080:8080 portal-local:latest
          fail() { echo "SMOKE: $1"; docker logs portal | tail -40; exit 1; }
          for _ in $(seq 30); do curl -sf localhost:8080/healthz >/dev/null && break; sleep 1; done
          curl -sf localhost:8080/healthz >/dev/null || fail "/healthz not 200 after 30 s"
          curl -sf localhost:8080/ | grep -qi '<html' || fail "/ serves no page"
          curl -sf localhost:8080/api/v1/version | jq -e . >/dev/null || fail "/api/v1/version not JSON"
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/projects)
          [ "$code" = 401 ] || fail "/api/v1/projects without a token answered $code, not 401"
          echo "healthz 200, / page, version JSON, projects 401 without a token"
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: |
            APT_REFRESH=${{ steps.day.outputs.d }}
            JC_PORTAL_COMMIT=${{ github.sha }}
          push: true
          # dev-<N>: built and smoke-tested; the full-test promote adds :<N> and :latest (T-4721)
          tags: ${{ matrix.image }}:${{ github.sha }},${{ matrix.image }}:main,${{ matrix.image }}:dev-${{ github.run_number }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true
      # AP-142: the rust runner builds the SDK's React + Rust/WebAssembly example to a static
      # bundle, offline, its browser checks included, before the image is signed.
      - if: matrix.name == 'app-builder-rust'
        name: the rust runner builds a ui App with WebAssembly
        run: |
          docker run --rm -v "$PWD/sdk/examples/react-rust-wasm:/src:ro" -v "$PWD/builder/lane-wasm-check.sh:/lane-wasm-check.sh:ro" \
            --entrypoint sh "${{ matrix.image }}@${{ steps.push.outputs.digest }}" /lane-wasm-check.sh
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - run: cosign sign --yes ${{ matrix.image }}@${{ steps.push.outputs.digest }}
      - run: echo "${{ matrix.name }} digest ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      # OPS-41 asks for the bill of materials in CycloneDX; `sbom: true` above attaches
      # BuildKit's SPDX one. The CycloneDX document is read off the pushed digest and attested
      # to it, because an uploaded artifact expires and an attestation travels with the image
      # (T-2412).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.image }}@${{ steps.push.outputs.digest }}"
          format: cyclonedx
          output: sbom.cdx.json
      - run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json ${{ matrix.image }}@${{ steps.push.outputs.digest }}
      # Read back what was just attested, by the same digest and under the identity of this
      # workflow: a lane that stops attesting, or attests under another identity, goes red here
      # instead of publishing an image nothing describes. Before the vulnerability gate below,
      # because an image that fails that gate is the one whose contents somebody needs.
      - run: |
          cosign verify-attestation --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/image.yml@${{ github.ref }}" \
            "${{ matrix.image }}@${{ steps.push.outputs.digest }}" > /dev/null
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ matrix.image }}@${{ steps.push.outputs.digest }}", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
