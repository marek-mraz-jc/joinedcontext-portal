# The authorization matrix (T-2797, PF-52, AC-01): every route the Portal serves and what each
# role of the taxonomy gets from it. tests/authz_matrix_tests.rs holds every cell on every push
# against a mocked forge; joinedcontext-conformance tests/authz sends the cells dev can answer
# nightly. A new route without a row fails the gate.
#
# Cells: `allow` (the caller passes the check: never 401 or 403, and no 404 on a row where
# somebody else's refusal is 404), or the status the caller gets instead. Anonymous writes answer
# 403: the CSRF check runs before anyone is asked who they are. A 404 for a role the rule
# allows, a 409, 422 or 503 is the fixture's (an object, a body or a service it lacks); the note
# says which.
roles: [anonymous, viewer, editor, steward, approver, org-admin, other-member, service-account]
