              apiVersion: joinedcontext.com/v1alpha1
              kind: Endpoint
              metadata: { name: '{project}-preview', namespace: '{project}' }
              spec: { slug: bikecountersworkspacezzzzzz, contextSpaceRef: doprava, audience: public, enabledRepresentations: [ngsi-ld] }
      keep: planId
