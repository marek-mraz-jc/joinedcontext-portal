      keep: planId
      contains: ['"planId"', '7c1e4b2a-9d3f-4a6e-8b5c-2f0a1d9e3b47']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    - proves: deny
      as: steward
      call: jc_change_plan
      args: { changes: [{ op: create, kind: RoleBinding, name: jana-admin, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: RoleBinding, metadata: { name: jana-admin, namespace: org }, spec: { subjects: [{ user: 7c1e4b2a-9d3f-4a6e-8b5c-2f0a1d9e3b47 }], role: scn-project-admin, scope: { project: '{project}' } } } }] }
      refused: true
      contains: ['PF-52']
