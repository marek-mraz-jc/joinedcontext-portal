- id: S-46
  segment: connector
  as: viewer
  says: "(Portal) Create a connector: project Doprava, Endpoints X and Y, read only, 30 days, claude.ai only."
  expect: 'connector URL /c/{id}; tools/list over it shows read tools for X and Y only'
  deny: 'tick an Endpoint outside the ceiling -> not offered in the tree, refused by the API'
  script:
    - proves: expect
      rest:
        method: POST
        path: /connectors
        body: { name: doprava-counters, segments: [data-read], scope: [{ project: '{project}', endpoint: '{project}-counters', access: read }], expiresAt: '{in7days}', allowedClients: ['https://claude.ai/oauth/mcp-client-metadata'] }
      contains: ['https://portal.test/c/', '"clientIsBoundary":true']
    - proves: expect
      via: connector
      client: 'https://claude.ai/oauth/mcp-client-metadata'
      contains: ['jc_resource_get', 'jc_kpi_compute']
      absent: ['jc_resource_list', 'propose', 'delete', 'approve']
    - proves: expect
      via: connector
      client: 'https://claude.ai/oauth/mcp-client-metadata'
      call: jc_resource_get
      args: { kind: Endpoint, name: '{project}-counters' }
      contains: ['BikeCounter']
    - proves: deny
      via: connector
      client: 'https://claude.ai/oauth/mcp-client-metadata'
      call: jc_resource_get
      args: { kind: Endpoint, name: 't-scn-other-counters' }
      refused: true
      contains: ['does not reach Endpoint t-scn-other-counters']
    - proves: deny
      rest:
        method: POST
        path: /connectors
        body: { name: other-counters, segments: [data-read], scope: [{ project: t-scn-other, endpoint: t-scn-other-counters, access: read }], expiresAt: '{in7days}' }
      refused: true
      contains: ['scope[0].project']
