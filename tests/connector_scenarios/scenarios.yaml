      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Endpoint, name: '{project}-counters', patch: { spec: { title: null, entityTypes: null, projection: { hiddenAttributes: [ownerEmail] } } } }] }
      keep: planId
