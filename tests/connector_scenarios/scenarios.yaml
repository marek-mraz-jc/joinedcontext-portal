# Connector scenario catalogue (owner order 2026-10-28, GOAL-connectors.md).
# 50 jobs a person does in the platform through an MCP connector (Claude Code, claude.ai, ChatGPT) or the
# Portal assistant. Each scenario runs three ways (GOAL point 5):
#   scripted: the harness calls the tools itself (no model), deterministic, in CI on every portal change;
#   model:    a model gets `says` and the connector, graded on the end state and the calls, hourly ci-full;
#   live:     once on dev through Claude Code and the Portal assistant, evidence (calls, shots) in the task.
# Fields: segment = connector preset (what the person ticks), as = persona, says = the request,
# expect = end state a reviewer checks, deny = the same request where it must be refused (and what refuses it).
# script = the scripted lane's tool calls (tests/connector_scenarios.rs, T-5947): each step names what it
# proves (expect or deny), the tool (none = tools/list), its args, the project (own = t-scn-NN, other =
# t-scn-other, bound to nobody), whether the door must refuse it, and texts the answer must or must not hold.
# A scenario without a script, or failing it, is listed in red.txt with the task that greens it.
# Fixtures: the harness creates its own project t-scn-<run> with a space, a DataModel, an Endpoint and a CSV
# source; nothing touches a real tenant. Approvals are done by a second persona in the Portal, never by the connector.

- id: S-01
  segment: data-read
  as: viewer
  says: "Which data Endpoints exist in this project and what types do they serve?"
  expect: 'list of the project''s Endpoints with their entity types and access URLs; no Endpoint of another project'
  deny: 'connector scoped to project A asked about project B -> the tool is not listed / 403, nothing of B in the answer'
  script:
    - proves: expect
      call: jc_resource_list
      args: { kind: Endpoint }
      contains: ['{project}-counters', 'BikeCounter', 'https://']
      absent: ['t-scn-other']
    - proves: deny
      call: jc_resource_list
      project: other
      args: { kind: Endpoint }
      refused: true
      absent: ['t-scn-other-counters']
