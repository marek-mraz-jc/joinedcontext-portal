  deny: 'a slug with digits 0/1/8/9 -> validation error naming the field'
  script:
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Endpoint, name: '{project}-public', manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Endpoint, metadata: { name: '{project}-public', namespace: '{project}' }, spec: { slug: bikecounterspublicdopravazz, contextSpaceRef: doprava, audience: public, enabledRepresentations: [ngsi-ld, odata, ogc-features] } } }] }
      keep: planId
      contains: ['"planId"', '"ok":true']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    - proves: deny
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Endpoint, name: '{project}-bad', manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Endpoint, metadata: { name: '{project}-bad', namespace: '{project}' }, spec: { slug: bikecounters0publicdopravaz, contextSpaceRef: doprava, audience: public, enabledRepresentations: [ngsi-ld] } } }] }
      refused: true
      contains: ['/changes/0/manifest', 'slug']
