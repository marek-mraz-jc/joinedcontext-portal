  segment: pipeline
  as: steward
  says: "Add a DataSource for https://<fixture>/counters.csv, hourly."
  expect: 'DataSource manifest; check of the source succeeds; host on the outbound allow-list'
  deny: 'a host outside the allow-list or a private IP -> refused by the outbound guard'
  script:
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: DataSource, name: counters-hourly, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: DataSource, metadata: { name: counters-hourly, namespace: '{project}' }, spec: { type: http, http: { url: 'https://data.example.sk/counters.csv', format: csv } } } }] }
      keep: planId
      contains: ['"planId"', '"ok":true']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    - proves: deny
      call: jc_change_plan
      args: { changes: [{ op: create, kind: DataSource, name: counters-inside, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: DataSource, metadata: { name: counters-inside, namespace: '{project}' }, spec: { type: http, http: { url: 'http://10.0.0.5/counters.csv', format: csv } } } }] }
      refused: true
      contains: ['10.0.0.5']
- id: S-18
  segment: pipeline
  as: steward
  says: "Show me 5 sample rows of this source."
  expect: 'sample_source returns the real first rows'
  deny: 'none'
- id: S-19
  segment: pipeline
  as: steward
  says: "Write a mapping from these rows to BikeCounter and test it."
  expect: 'try_mapping returns NGSI-LD entities valid against the model, with observedAt on every attribute'
  deny: 'mapping output invalid -> the error with the field path comes back and the model fixes it in a second try'
- id: S-20
  segment: pipeline
  as: steward
  says: "Create the pipeline, hourly, upsert into Endpoint X."
  expect: 'Pipeline manifest valid; validate passes; change request opened; after merge the first run writes > 0 entities'
  deny: 'pipeline aimed at a policyRef or app-* Endpoint -> refused (writes as pl-{pipeline})'
  script:
    # A Pipeline's records are tested on a sample before a plan holds it (T-4840).
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Pipeline, name: counters-new, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Pipeline, metadata: { name: counters-new, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', source: { dataSourceRef: { kind: DataSource, name: counters-csv } }, targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-intake', output: { type: BikeCounter, mode: upsert }, quotas: { maxMemoryMb: 128, cpuMillicores: 100 } } } }] }
      refused: true
      contains: ['/changes/0/manifest', 'jc_pipeline_test']
    # The runner's test of the planned spec comes back green (T-4840).
    - proves: expect
      runner_tested: counters-new
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Pipeline, name: counters-new, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Pipeline, metadata: { name: counters-new, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', source: { dataSourceRef: { kind: DataSource, name: counters-csv } }, targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-intake', output: { type: BikeCounter, mode: upsert }, quotas: { maxMemoryMb: 128, cpuMillicores: 100 } } } }] }
      keep: planId
      contains: ['"planId"', '"ok":true']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    # The read Endpoint names its own Policy, so it binds no write of the Pipeline (PL-111).
    - proves: deny
      call: jc_change_plan
      args: { changes: [{ op: create, kind: Pipeline, name: counters-misaimed, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: Pipeline, metadata: { name: counters-misaimed, namespace: '{project}' }, spec: { class: scheduled, schedule: '0 * * * *', source: { dataSourceRef: { kind: DataSource, name: counters-csv } }, targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:{project}-doprava:{project}-readers', output: { type: BikeCounter, mode: upsert }, quotas: { maxMemoryMb: 128, cpuMillicores: 100 } } } }] }
      refused: true
      contains: ['targetEndpoint']
- id: S-21
  segment: pipeline
  as: steward
  says: "The pipeline wrote 0 entities last night. Why?"
  expect: 'reads run state and logs; names the cause (source read failed, nack, refused write) with the log line'
  deny: 'none'
- id: S-22
  segment: pipeline
  as: steward
  says: "Change the schedule to every 15 minutes."
  expect: 'one-field diff; plan valid'
  deny: 'below the project''s minimum period -> refused naming the limit'
  script:
    # A Pipeline's records are tested on a sample before a plan holds it (T-4840).
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Pipeline, name: counters-hourly, patch: { spec: { schedule: '*/15 * * * *' } } }] }
      refused: true
      contains: ['/changes/0/manifest', 'jc_pipeline_test']
    # The runner's test of the planned spec comes back green (T-4840).
    - proves: expect
      runner_tested: counters-hourly
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Pipeline, name: counters-hourly, patch: { spec: { schedule: '*/15 * * * *' } } }] }
      keep: planId
      contains: ['"planId"', '*/15 * * * *']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    # The organization's floor is 15 minutes (PL-116): every five is refused at the field.
    - proves: deny
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Pipeline, name: counters-hourly, patch: { spec: { schedule: '*/5 * * * *' } } }] }
      refused: true
      contains: ['/changes/0/manifest/spec/schedule', 'minimum period of 900 s', 'minPipelinePeriodSeconds']
- id: S-23
  segment: pipeline
  as: steward
  says: "Switch the output from upsert to replace."
  expect: 'plan warns which stored attributes an older mapping wrote (WriteGuard) before applying'
  deny: 'none'
- id: S-24
  segment: pipeline
  as: steward
  says: "Run the pipeline now and tell me the result."
  expect: 'run started, finished state and counts reported'
  deny: 'connector without pipeline-run right -> refused'
- id: S-25
  segment: pipeline
  as: steward
  says: "Pause the sync source and later resume it."
  expect: 'syncsource pause, status paused, sync resumes'
  deny: 'none'
- id: S-26
  segment: pipeline
  as: steward
  says: "Integrate this ArcGIS FeatureServer layer end to end."
  expect: 'S-17..S-20 in one conversation: source, sample, mapping, test, pipeline, change request; paging by resultOffset'
  deny: 'none'

