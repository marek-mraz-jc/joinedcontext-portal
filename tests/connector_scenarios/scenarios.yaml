- id: S-15
  segment: context
  as: steward
  says: "Add a relationship refStation from BikeCounter to Station, with the inverse slot."
  expect: 'both slots in the model; the model compiles in Model Tools'
  deny: 'relationship to a missing class -> plan refused naming the class'
  script:
    - proves: expect
      call: jc_change_plan
      args:
        changes:
          - op: patch
            kind: DataModel
            name: bike-counter
            source: |
              id: https://example.org/doprava
              name: doprava
              default_range: string
              slots:
                name: { required: true }
                count: { range: integer }
                startDate: { range: datetime, required: true }
                refStation: { range: Station }
                refBikeCounter: { range: BikeCounter, multivalued: true, inverse: refStation }
              classes:
                BikeCounter: { slots: [name, count, refStation] }
                Event: { slots: [name, startDate] }
                Station: { slots: [name, refBikeCounter] }
      keep: planId
      contains: ['"planId"', 'refStation', 'refBikeCounter', '"ok":true']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    - proves: deny
      call: jc_change_plan
      args:
        changes:
          - op: patch
            kind: DataModel
            name: bike-counter
            source: |
              id: https://hel.fi/models/bike-counter
              name: bike-counter
              prefixes:
                linkml: https://w3id.org/linkml/
              imports: [linkml:types]
              classes:
                BikeCounter:
                  attributes:
                    name: { range: string }
                    count: { range: integer, required: true }
                    refStation: { range: Depot }
                Station:
                  attributes:
                    name: { range: string }
                    refBikeCounter: { range: BikeCounter, multivalued: true, inverse: refStation }
      refused: true
      contains: ['/changes/0/source/classes/BikeCounter/attributes/refStation/range', "class 'Depot'"]
- id: S-16
  segment: context
  as: steward
  says: "Deprecate the old Endpoint and point users to the new one."
  expect: 'EndpointDeprecation manifest; old Endpoint answers with the deprecation header'
  deny: 'none'
  script:
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Endpoint, name: '{project}-counters', patch: { spec: { deprecation: { since: '2026-10-28', sunset: '2027-02-01', link: 'https://data.example.sk/changes/counters-v2' } } } }] }
      keep: planId
      contains: ['"planId"', '"ok":true', 'deprecation', '2027-02-01']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
      absent: ['"merged"']
    - proves: deny
      call: jc_change_plan
      args: { changes: [{ op: patch, kind: Endpoint, name: '{project}-counters', patch: { spec: { deprecation: { since: '2026-10-28', sunset: '2026-11-28' } } } }] }
      refused: true
      contains: ['spec.deprecation.sunset', 'EP-146']

