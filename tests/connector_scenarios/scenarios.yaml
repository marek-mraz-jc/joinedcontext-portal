# Connector scenario catalogue (owner order 2026-10-28, GOAL-connectors.md).
# 50 jobs a person does in the platform through an MCP connector (Claude Code, claude.ai, ChatGPT) or the
# Portal assistant. Each scenario runs three ways (GOAL point 5):
#   scripted: the harness calls the tools itself (no model), deterministic, in CI on every portal change;
#   model:    a model gets `says` and the connector, graded on the end state and the calls, hourly ci-full;
#   live:     once on dev through Claude Code and the Portal assistant, evidence (calls, shots) in the task.
# Fields: segment = connector preset (what the person ticks), as = persona, says = the request,
# expect = end state a reviewer checks, deny = the same request where it must be refused (and what refuses it).
# script = the scripted lane's tool calls (tests/connector_scenarios.rs, T-5947): each step names what it
# proves (expect or deny), the tool (none = tools/list), its args, the project (own = t-scn-NN, other =
# t-scn-other, bound to nobody), whether the door must refuse it, and texts the answer must or must not hold.
# A scenario without a script, or failing it, is listed in red.txt with the task that greens it.
# Fixtures: the harness creates its own project t-scn-<run> with a space, a DataModel, an Endpoint and a CSV
# source; nothing touches a real tenant. Approvals are done by a second persona in the Portal, never by the connector.

- id: S-01
  segment: data-read
  as: viewer
  says: "Which data Endpoints exist in this project and what types do they serve?"
  expect: 'list of the project''s Endpoints with their entity types and access URLs; no Endpoint of another project'
  deny: 'connector scoped to project A asked about project B -> the tool is not listed / 403, nothing of B in the answer'
  script:
    - proves: expect
      call: jc_resource_list
      args: { kind: Endpoint }
      contains: ['{project}-counters', 'BikeCounter', 'https://']
      absent: ['t-scn-other']
    - proves: deny
      call: jc_resource_list
      project: other
      args: { kind: Endpoint }
      refused: true
      absent: ['t-scn-other-counters']
- id: S-02
  segment: data-read
  as: viewer
  says: "Show the 10 newest entities of type Sensor with their last value."
  expect: 'one query_data call with type, limit 10, orderBy modifiedAt; values match a direct NGSI-LD GET'
  deny: 'Endpoint not ticked in the connector -> refused naming the Endpoint'
  script:
    - proves: expect
      rest:
        method: POST
        path: /connectors
        body: { name: s02-counters, segments: [data-read], scope: [{ project: '{project}', endpoint: '{project}-counters', access: read }], expiresAt: '{in7days}' }
      contains: ['"state":"active"']
    - proves: expect
      via: connector
      call: jc_data_query
      args: { endpoint: '{project}-counters', type: BikeCounter, limit: 10, orderBy: 'modifiedAt;desc' }
      contains: ['urn:ngsi-ld:BikeCounter:snp', '"value":42', 'urn:ngsi-ld:BikeCounter:hron']
    - proves: deny
      via: connector
      call: jc_data_query
      args: { endpoint: '{project}-reports', type: PotholeReport }
      refused: true
      contains: ['{project}-counters']
      absent: ['urn:ngsi-ld:PotholeReport']
- id: S-03
  segment: data-read
  as: viewer
  says: "How many entities of each type are in Endpoint X?"
  expect: 'counts equal entities?type=T&count=true&limit=0 per type'
  deny: 'none'
  script:
    - proves: expect
      call: jc_data_query
      args: { endpoint: '{project}-counters', type: BikeCounter, count: true, limit: 0 }
      contains: ['"total":2']
- id: S-04
  segment: data-read
  as: viewer
  says: "Give me the history of attribute temperature of entity E for yesterday, hourly average."
  expect: 'temporal read with aggregation; numbers equal the temporal API''s answer'
  deny: 'Endpoint view without temporal operation -> 404 explained as "this Endpoint serves no history"'
  script:
    - proves: expect
      call: jc_data_query
      args: { endpoint: '{project}-counters', id: 'urn:ngsi-ld:BikeCounter:snp', attrs: [count], temporal: { timerel: between, timeAt: '2026-10-27T00:00:00Z', endTimeAt: '2026-10-28T00:00:00Z', aggrMethods: [avg], aggrPeriodDuration: PT1H } }
      contains: ['"avg"', '21.5']
    - proves: deny
      call: jc_data_query
      args: { endpoint: '{project}-reports', type: PotholeReport, temporal: { timerel: after, timeAt: '2026-10-27T00:00:00Z' } }
      refused: true
      contains: ['serves no history']
- id: S-05
  segment: data-read
  as: viewer
  says: "Find all parking places within 500 m of point 48.736,19.146."
  expect: 'geo-query georel near;maxDistance==500; result ids equal the direct query'
  deny: 'none'
  script:
    - proves: expect
      call: jc_data_query
      args: { endpoint: '{project}-counters', type: BikeCounter, georel: 'near;maxDistance==500', geometry: Point, coordinates: [19.146, 48.736] }
      contains: ['urn:ngsi-ld:BikeCounter:snp']
      absent: ['urn:ngsi-ld:BikeCounter:hron']
- id: S-06
  segment: data-read
