- id: S-50
  segment: connector
  as: steward
  says: "Revoke the connector, then call it."
  expect: 'next call 401/403; the audit log lists every call with connector, person, client, tool, target, verdict'
  deny: 'this scenario IS the deny case'
  script:
    - proves: expect
      as: steward
      rest:
        method: POST
        path: /connectors
        body: { name: steward-reads, segments: [data-read], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      contains: ['https://portal.test/c/', '"state":"active"']
    - proves: expect
      via: connector
      call: jc_resource_list
      args: { kind: Endpoint }
      contains: ['{project}-counters']
    - proves: expect
