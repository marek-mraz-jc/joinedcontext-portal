            name: counters-load
            manifest:
              apiVersion: joinedcontext.com/v1alpha1
              kind: Pipeline
              metadata: { name: counters-load, namespace: '{project}' }
              spec:
                class: auto
                period: 1h
                source: { dataSourceRef: { kind: DataSource, name: counters-csv } }
                compute: { kind: bloblang, bloblang: 'root = this' }
                targetEndpoint: 'urn:ngsi-ld:Endpoint:hel.fi:doprava:{project}-counters'
      refused: true
      contains: ['/changes/0/manifest', 'jc_pipeline_test']
    - proves: expect
