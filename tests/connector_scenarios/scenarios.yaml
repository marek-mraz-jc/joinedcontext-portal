  expect: 'the representation URLs the Endpoint config lists, each answering 200'
  deny: 'representation the Endpoint does not list -> not offered'
- id: S-07
  segment: data-read
  as: anonymous
  says: "What does the public Endpoint for air quality show now?"
  expect: 'public connector answers from the public Endpoint only'
  deny: 'anonymous asks for a non-public Endpoint -> refused, no count or name leaks'
- id: S-08
  segment: data-read
  as: viewer
  says: "Which datasets about schools are in the catalogue?"
  expect: 'catalogue search hits with dataset links'
  deny: 'none'

- id: S-09
  segment: context
  as: steward
  says: "Create a DataModel BikeCounter with slots name, location (GeoProperty), count (integer), observedAt."
  expect: 'plan_change returns a valid LinkML DataModel manifest and a diff; apply_change opens one change request; approver merges in the Portal; model served'
  deny: 'connector without write -> plan allowed (validate_only), apply refused'
  script:
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: DataModel, name: bikes, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: DataModel, metadata: { name: bikes, namespace: '{project}' }, spec: { contextSpaceRef: doprava, linkml: ./bikes.linkml.yaml, version: 0.1.0, lifecycle: draft } } }] }
      keep: planId
      contains: ['"planId"', '"baseEtag"', '"expiresAt"', '"ok":true']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests', 'https://gitea.example.sk/pulls/77']
      absent: ['"merged"']
    - proves: deny
      call: jc_change_apply
      args: { planId: '{planId}' }
      refused: true
      contains: ['is not there']
    - proves: deny
      rest:
        method: POST
        path: /connectors
        body: { name: doprava-read, segments: [data-read], scope: [{ project: '{project}', access: read }], expiresAt: '{in7days}' }
      contains: ['"writes":false']
    - proves: deny
      via: connector
      absent: ['jc_change_apply']
    - proves: deny
      via: connector
      call: jc_change_apply
      args: { planId: '{planId}' }
      refused: true
- id: S-10
  segment: context
  as: steward
  says: "Add an optional slot direction (enum in, out) to BikeCounter."
  expect: 'diff touches one model file; version bumped; existing entities still valid'
  deny: 'removing a required slot used by stored entities -> plan shows the breaking change and the affected count'
  script:
    - proves: expect
      call: jc_change_plan
      args:
        changes:
          - op: patch
            kind: DataModel
            name: bike-counter
            source: |
              id: https://example.org/doprava
              name: doprava
              default_range: string
              enums:
                Direction:
                  permissible_values: { in: {}, out: {} }
              slots:
                name: { required: true }
                count: { range: integer }
                startDate: { range: datetime, required: true }
                direction: { range: Direction }
              classes:
                BikeCounter: { slots: [name, count, direction] }
                Event: { slots: [name, startDate] }
                Station: { slots: [name] }
      keep: planId
      contains: ['"planId"', '"severity":"additive"', '"version":"1.1.0"', '"lane":"yellow"', 'direction']
    - proves: expect
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests', 'https://gitea.example.sk/pulls/77']
      absent: ['"merged"']
    - proves: deny
      call: jc_change_plan
      args:
        changes:
          - op: patch
            kind: DataModel
            name: bike-counter
            source: |
              id: https://example.org/doprava
              name: doprava
              default_range: string
              slots:
                name: { required: true }
                count: { range: integer }
                startDate: { range: datetime, required: true }
              classes:
                BikeCounter: { slots: [count] }
                Event: { slots: [name, startDate] }
                Station: { slots: [name] }
      contains: ['"severity":"breaking"', '"version":"2.0.0"', '"lane":"red"', 'BikeCounter.name', '"affectedEntities":12']
- id: S-11
  segment: context
  as: steward
  says: "Infer a DataModel from this CSV sample."
  expect: 'model inference returns slots with ranges matching the sample columns'
  deny: 'none'
- id: S-12
  segment: context
  as: steward
  says: "Create a context space Doprava with retention 365 days."
  expect: 'Space manifest valid, retention block as asked, change request opened'
  deny: 'steward of another project -> refused'
  script:
    # Retention deletes data, so only an owner of the space sets it (DM-85): the steward is told
    # so, and the project's admin plans it.
    - proves: expect
      call: jc_change_plan
      args: { changes: [{ op: create, kind: ContextSpace, name: doprava-archiv, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: ContextSpace, metadata: { name: doprava-archiv, namespace: '{project}' }, spec: { isSandbox: true, retention: [{ entityType: '*', history: P365D }] } } }] }
      refused: true
      contains: ['DM-85']
    - proves: expect
      as: project-admin
      call: jc_change_plan
      args: { changes: [{ op: create, kind: ContextSpace, name: doprava-archiv, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: ContextSpace, metadata: { name: doprava-archiv, namespace: '{project}' }, spec: { isSandbox: true, retention: [{ entityType: '*', history: P365D }] } } }] }
      keep: planId
      contains: ['"planId"', 'retention']
    - proves: expect
      as: project-admin
      call: jc_change_apply
      args: { planId: '{planId}' }
      contains: ['changeRequests']
    - proves: deny
      call: jc_change_plan
      project: other
      args: { changes: [{ op: create, kind: ContextSpace, name: doprava-archiv, manifest: { apiVersion: joinedcontext.com/v1alpha1, kind: ContextSpace, metadata: { name: doprava-archiv, namespace: t-scn-other }, spec: { isSandbox: true } } }] }
      refused: true
