# T-2742: a relationship asked without its inverse: the platform takes both ends in one
# addRelationship, so the assistant names the inverse itself (DM-64, DM-73).
workflow: datamodel
as: steward
says:
  - "In the helsinki data model, an event belongs to one city district."
expect:
  calls:
    - tool: change_resource
      input: { kind: DataModel, name: helsinki, operations: [{ op: addRelationship }] }
  outcome: change
refusal:
  as: viewer
  says: "In the helsinki data model, an event belongs to one city district."
