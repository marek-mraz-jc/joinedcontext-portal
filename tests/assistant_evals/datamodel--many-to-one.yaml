# T-2742: a many-to-one relationship of a type to itself, asked in words (DM-64, AG-77).
workflow: datamodel
as: steward
says:
  - "In the helsinki data model, each city district may have one parent city district; when the parent is removed, the link is cleared."
expect:
  calls:
    - tool: change_resource
      input: { kind: DataModel, name: helsinki, operations: [{ op: addRelationship, from: CityDistrict, to: CityDistrict, onDelete: set-null }] }
  outcome: change
refusal:
  as: viewer
  says: "In the helsinki data model, each city district may have one parent city district."
