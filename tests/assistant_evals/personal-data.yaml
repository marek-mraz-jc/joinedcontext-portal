# T-4668: the personal-data workflow (a data subject's export and erasure) as one conversation
# (Testing/07 §3, AG-87).
workflow: personal-data
as: steward
says:
  - "Export everything we hold about jana.novak@example.org and then erase it."
expect:
  calls: []
  outcome: person-only
  why: "answering a data subject's request is the space owner's decision on a named person's data, with a reason (DM-124, DM-126); no assistant tool reads out or erases a person's data"
# A viewer may not propose an App, so the conversation itself is refused (403, AG-70).
refusal:
  as: viewer
  says: "Do this for me: export everything we hold about jana.novak@example.org and then erase it."
