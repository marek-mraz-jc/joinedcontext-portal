# T-4880: the mqttbroker workflow (reading and clearing a broker's capture) as one conversation
# (Testing/07 §3, AG-87).
workflow: mqttbroker
as: steward
says:
  - "Clear what the city MQTT broker captured from the sensors."
expect:
  calls: []
  outcome: person-only
  why: "clearing a broker's captured device messages is a steward's call on payloads no agent reads (PL-87); no assistant tool reads or deletes a capture"
# A viewer may not propose an App, so the conversation itself is refused (403, AG-70).
refusal:
  as: viewer
  says: "Do this for me: clear what the city MQTT broker captured from the sensors."
