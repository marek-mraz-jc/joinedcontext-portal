input:
  generate:
    interval: 60s
    mapping: |-
      root = ""
      meta jc_run = now().ts_format("2006-01-02T15:04:05Z", "UTC")
  label: input
output:
  label: output
  switch:
    cases:
    - check: errored()
      output:
        reject: ${! error() }
    - output:
        drop: {}
    retry_until_success: false
pipeline:
  processors:
  - label: processor_0
    try:
    - http:
        timeout: 15s
        tls:
          enabled: true
        url: https://gbfs.theta.fifteen.eu/gbfs/2.2/helsinki/en/station_status.json
        verb: GET
  - label: processor_1
    mutation: root = if errored() { deleted() }
  - label: compute
    mapping: root = this.data.bikes
  - label: source_events
    mapping: |-
      # spec.sourceDeletes.deletedWhen (PL-98), rendered by the Portal.
      map jc_deleted_when {
        root = (
      this.status.or("") == "withdrawn"
        )
      }
      let records = if this.type() == "array" { this } else { [this] }
      let judged = $records.map_each(e -> {"record": e, "verdict": if e.type() == "object" { e.apply("jc_deleted_when").catch(err -> {"error": err}) } else { false }})
      let kept = $judged.filter(j -> j.verdict == false).map_each(j -> j.record)
      meta jc_marked = $judged.filter(j -> j.verdict == true).map_each(j -> j.record.id.or("").string()).format_json(no_indent: true).string()
      meta jc_marked_failed = $judged.filter(j -> j.verdict.type() != "bool").map_each(j -> {"id": j.record.id.or("").string(), "message": if j.verdict.type() == "object" { j.verdict.error.or("").string() } else { "deletedWhen answered " + j.verdict.format_json(no_indent: true).string() + ", not true or false" }}).format_json(no_indent: true).string()
      root = if this.type() == "array" { $kept } else if $kept.length() == 1 { $kept.index(0) } else { [] }
  - label: source_events_post
    switch:
    - check: '!errored()'
      processors:
      - branch:
          processors:
          - http:
              headers:
                Content-Type: application/json
              oauth2:
                client_key: ${JC_CLIENT_ID}
                client_secret: ${JC_CLIENT_SECRET}
                enabled: true
                token_url: ${JC_TOKEN_URL}
              retries: 1
              timeout: 5s
              url: http://portal-internal:8081/internal/pipelines/helsinki/buses/source-events
              verb: POST
          request_map: |-
            let ids = meta("jc_marked").or("[]").parse_json()
            let failed = meta("jc_marked_failed").or("[]").parse_json()
            root = if $ids.length() + $failed.length() == 0 { deleted() } else { {"run": meta("jc_run").or(now().ts_format("2006-01-02T15:00Z", "UTC")), "ids": $ids, "failed": $failed} }
      - catch:
        - log:
            level: WARN
            message: 'the source''s delete marks did not reach the Portal; nothing is deleted: ${! error() }'
  - label: source_events_kept
    mapping: root = if this.type() == "array" && this.length() == 0 { deleted() } else { this }
  - label: lifetime
    mapping: |
      # spec.lifetime (PL-80…PL-82), generated by jcctl: the end times, after the author's steps.
      map jc_lifetime {
        root = this
        if this.type == "Bus" {
          let start = this.without("id", "type", "scope", "@context", "createdAt", "modifiedAt", "deletedAt", "expiresAt").values().map_each(a -> if a.type() == "array" { a } else { [a] }).flatten().map_each(i -> if i.type() == "object" { i.observedAt.or("").ts_unix().catch(null) } else { null }).filter(t -> t != null).max().catch(null)
          let end = if $start != null { $start + 600 } else { null }
          if $end != null {
            root.expiresAt = $end.ts_format("2006-01-02T15:04:05Z", "UTC")
          }
          if $start == null {
            root._jc_lifetime_from = true
          }
        }
      }
      let jc_out = if this.type() == "array" { this.map_each(e -> if e.type() == "object" { e.apply("jc_lifetime") } else { e }) } else if this.type() == "object" { this.apply("jc_lifetime") } else { this }
      let jc_failed = if $jc_out.type() == "array" { $jc_out.any(e -> e.type() == "object" && e._jc_lifetime_from.or(false) == true) } else { $jc_out.type() == "object" && $jc_out._jc_lifetime_from.or(false) == true }
      if $jc_failed {
        meta jc_problem = "lifetime-from"
      }
      root = if $jc_out.type() == "array" { $jc_out.map_each(e -> if e.type() == "object" { e.without("_jc_lifetime_from") } else { e }) } else if $jc_out.type() == "object" { $jc_out.without("_jc_lifetime_from") } else { $jc_out }
  - label: processor_6
    mapping: root = if this.type() == "array" { this } else { [this] }
  - label: processor_7
    unarchive:
      format: json_array
  - label: processor_8
    split:
      byte_size: 1048576
      size: 1000
  - archive:
      format: json_array
    label: processor_9
  - branch:
      processors:
      - http:
          drop_on:
          - 400
          - 413
          - 422
          headers:
            Content-Type: application/json
          oauth2:
            client_key: helsinki-pipelines
            client_secret: ${JC_CLIENT_SECRET_HELSINKI}
            enabled: true
            token_url: ${JC_TOKEN_URL}
          rate_limit: pipeline_egress
          timeout: 30s
          url: ${JC_GATEWAY_URL}/api/endpoint/busslug/ngsi-ld/v1/entityOperations/upsert?options=update
          verb: POST
      result_map: |-
        let errors = content().parse_json().catch({}).errors.or([])
        meta jc_refused_write_0 = $errors.map_each(e -> { "id": e.entityId.or(""), "message": e.error.detail.or(e.error.title).or("") }).format_json(no_indent: true)
    label: write_0
  - label: write_refused
    switch:
    - check: errored() && error().re_match("unexpected response code \\((400|413|422)\\)")
      processors:
      - catch:
        - mutation: |-
            let problem = error().re_replace_all("(?s)^.*?Error: ", "").parse_json().catch({})
            meta jc_failed = $problem.detail.or($problem.title).or(error())
  threads: 4
